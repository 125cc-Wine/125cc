<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>125cc Carta y Cuaderno</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: una columna de celular (máx. 520 px), barra inferior fija con tres destinos y una hoja que sube para la ficha y la cata. Noche por defecto: el bar está en penumbra. */
:root{
  color-scheme: dark;
  --bg:#171B1F; --surface:#21272D; --surface-2:#2B333A; --line:#323B43; --line-strong:#47525C;
  --ink:#F3ECE2; --ink-soft:#ABA59B; --ink-faint:#7C776F;
  --tinto:#A8324A; --on-tinto:#FFF6F0; --oak:#C8A46A; --oak-ink:#1B1712; --danger:#C2463F;
  --map:#24211D; --map-line:#3A342D; --map-label:#9C8559;
  --paper:#D9CDB7; --paper-ink:#2B241F; --paper-soft:#685C51; --paper-rule:#C9BBA2; --paper-margin:#A4404C;
  --glass-edge:#E9E1D3; --bottle-edge:#5A656F; --spot:#38414A;
  --scrim:rgba(6,8,10,.62); --shadow:rgba(0,0,0,.38);
  --display:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
  --ui:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1); --nav-h:66px;
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#F5EFE5; --surface:#FFFBF4; --surface-2:#EDE4D5; --line:#E2D7C5; --line-strong:#CDBFA8;
  --ink:#2A2420; --ink-soft:#685E55; --ink-faint:#958A7F;
  --tinto:#7A1428; --on-tinto:#FFF6F0; --oak:#97743A; --oak-ink:#FFF8EE; --danger:#A2302A;
  --map:#EFE4D1; --map-line:#D9CAB0; --map-label:#8C7444;
  --paper:#FFFDF8; --paper-ink:#2A2420; --paper-soft:#7A6E63; --paper-rule:#EDE4D4; --paper-margin:#C47880;
  --glass-edge:#4A3F37; --bottle-edge:#BBAE97; --spot:#F8F1E5;
  --scrim:rgba(42,30,24,.42); --shadow:rgba(60,40,20,.16);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
body.locked{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--oak);outline-offset:2px}
p{margin:0}

.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 40px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px}
.wm{font:600 30px/1 var(--display);letter-spacing:-.01em}
.wm em{font-style:italic;font-weight:500;color:var(--oak)}
.pill{font:600 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--line-strong);border-radius:999px;padding:5px 8px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-soft)}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:20px;height:20px}

.eyebrow{font:600 11px/1.3 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--oak)}
.h1{margin:2px 0 0;font:600 38px/1.04 var(--display);text-wrap:balance}
.h2{margin:4px 0 0;font:600 30px/1.08 var(--display);text-wrap:balance}
.h3{margin:2px 0 0;font:600 25px/1.12 var(--display);text-wrap:balance}
.sub{margin-top:6px;color:var(--ink-soft);font-size:14px}
.center{text-align:center}
.view{padding-top:6px;animation:in .35s var(--ease)}
@keyframes in{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Carta */
.carta-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 14px}
.carta-count{text-align:right;font:600 15px/1.3 var(--ui)}
.carta-count span{display:block;font-weight:400;font-size:12.5px;color:var(--ink-soft)}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px}
.map{position:relative;width:100%;max-width:100%;aspect-ratio:1/.8;border-radius:16px;background:var(--map);overflow:hidden;touch-action:pan-y}
.map.big{aspect-ratio:1/1.1}
.map .ax{position:absolute;background:var(--map-line)}
.map .ax-x{left:5%;right:5%;top:50%;height:1px}
.map .ax-y{top:7%;bottom:7%;left:50%;width:1px}
.map .lb{position:absolute;font:600 9.5px/1 var(--ui);letter-spacing:.16em;color:var(--map-label);text-transform:uppercase;pointer-events:none}
.lb-t{top:9px;left:50%;transform:translateX(-50%)}
.lb-b{bottom:9px;left:50%;transform:translateX(-50%)}
.lb-l{left:9px;top:50%;transform:translateY(-150%)}
.lb-r{right:9px;top:50%;transform:translateY(-150%)}
.pin{position:absolute;width:34px;height:40px;margin:-21px 0 0 -17px;display:grid;place-items:center;border-radius:10px;transition:transform .25s var(--ease),opacity .25s}
.pin .copita{width:24px;height:30px;filter:drop-shadow(0 2px 3px var(--shadow))}
.pin:hover,.pin:focus-visible{transform:scale(1.18);z-index:2}
.pin.dim{opacity:.2}
.pin .sb{position:absolute;top:-4px;right:-9px;min-width:19px;height:14px;padding:0 3px;border-radius:999px;background:var(--oak);color:var(--oak-ink);font:700 9px/14px var(--ui);text-align:center}
.zona{position:absolute;width:30%;aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--oak);transform:translate(-50%,-50%);pointer-events:none}
.zona span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 9.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--oak)}
.map-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 6px 0;font-size:12.5px;color:var(--ink-faint)}
.link{color:var(--oak);font-weight:600;font-size:13px;padding:8px 2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;margin-inline:-16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);font-size:13.5px;font-weight:500;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.winelist{list-style:none;margin:6px 0 0;padding:0}
.row{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);text-align:left}
.row:hover .row-name{color:var(--oak)}
.num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--ui)}
.row-main{min-width:0}
.row-name{display:block;font-weight:500;font-size:15.5px;line-height:1.28;text-wrap:balance}
.row-meta{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.row-price{font:700 19px/1 var(--display);font-variant-numeric:tabular-nums}
.row-sub{font-size:11.5px;color:var(--ink-faint)}
.row-tag{font-size:11.5px;font-weight:600;color:var(--oak);white-space:nowrap}
.empty-row{padding:20px 4px;color:var(--ink-soft)}
.proto-note{margin-top:22px;font-size:12px;line-height:1.5;color:var(--ink-faint)}

/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-in{max-width:520px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:500 11.5px/1 var(--ui);color:var(--ink-faint)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav .nav-c .ring{width:48px;height:48px;margin-top:-20px;border-radius:50%;display:grid;place-items:center;background:var(--tinto);color:var(--on-tinto);box-shadow:0 6px 18px var(--shadow)}
.nav .nav-c[aria-current="page"] .ring{outline:2px solid var(--oak);outline-offset:3px}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--oak);color:var(--oak-ink);font:700 10.5px/18px var(--ui);text-align:center}

/* Hoja */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .32s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -12px 40px var(--shadow);transform:translateY(104%);transition:transform .38s var(--ease);outline:none}
.sheet.open{transform:none}
.sheet-grab{flex:none;position:relative;height:34px;display:grid;place-items:center;cursor:grab;touch-action:none}
.sheet-grab span{width:42px;height:5px;border-radius:3px;background:var(--line-strong)}
.sheet-x{position:absolute;top:4px;right:max(10px,env(safe-area-inset-right,0px))}
.sheet-body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:0 max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px))}
.sheet-foot{flex:none;display:flex;gap:10px;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot:empty{display:none}
.sheet-foot .confirm{flex:1;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.sheet-foot .confirm p{flex:1 1 100%;font-size:13.5px;color:var(--ink-soft)}

.btn{height:50px;padding:0 18px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn-primary{flex:1;background:var(--tinto);color:var(--on-tinto)}
.btn-ghost{flex:0 0 auto;border:1px solid var(--line-strong);color:var(--ink)}
.btn-danger{flex:1;background:var(--danger);color:var(--on-tinto)}
.btn.sm{height:40px;padding:0 14px;border-radius:12px;font-size:13.5px}
.btn.wide{width:100%}

/* Página del vino */
.ficha-hero{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:12px;align-items:end;padding:16px 14px 16px 18px;border-radius:20px;background:radial-gradient(circle at 82% 78%,var(--spot),transparent 62%),var(--surface-2)}
.fh-bottle{height:188px;display:flex;justify-content:center;align-items:flex-end}
.bottle{height:100%;width:auto;overflow:visible}
.bottle .edge{fill:none;stroke:var(--bottle-edge);stroke-width:.8}
.fh-bodega{margin-top:4px;color:var(--ink-soft);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase}
.fh-price{margin-top:14px;color:var(--ink-soft);font-size:13px}
.fh-price strong{margin-right:4px;font:700 27px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.mine{width:100%;display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px 14px;border-radius:14px;border:1px solid var(--line-strong);font-size:13px;color:var(--ink-soft);text-align:left}
.mine strong{color:var(--ink);font-weight:600}
.mine-score{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--oak);color:var(--oak-ink);font:700 17px/1 var(--display)}
.nota-somm{margin:22px 0 0}
.nota-somm blockquote{margin:6px 0 0;font:italic 500 21px/1.36 var(--display);text-wrap:pretty}
.block{margin-top:22px}
.block-t{margin:0 0 9px;font:600 11.5px/1.3 var(--ui);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft)}
.block-t span{font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink-faint)}
.perf{display:grid;grid-template-columns:80px auto;gap:9px 12px;align-items:center;font-size:13.5px}
.dots{display:inline-flex;gap:5px}
.dots i{width:24px;height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-strong)}
.dots i.on{background:var(--tinto);border-color:var(--tinto)}
.dots.oak i.on{background:var(--oak);border-color:var(--oak)}
.facts{margin:0}
.facts div{display:grid;grid-template-columns:98px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.facts dt{font-size:13px;color:var(--ink-soft)}
.facts dd{margin:0;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:13px}
.bodega p{color:var(--ink-soft);font-size:14px;line-height:1.55}
.ask{display:flex;gap:10px;align-items:flex-start;margin-top:22px;padding:12px 14px;border-radius:14px;border:1px dashed var(--oak);font-size:14px}
.ask svg{flex:none;width:20px;height:20px;margin-top:1px;color:var(--oak)}
.tienda{display:inline-block;margin:16px 0 2px;color:var(--oak);font-size:13.5px;font-weight:600;text-decoration:none}
.legend-map{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--ink-soft)}
.legend-map i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* Anotar */
.q{margin-top:22px}
.q-t{display:block;margin:0 0 10px;font-weight:600;font-size:15px}
.q-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.optional{margin-left:4px;font-weight:400;font-size:12.5px;color:var(--ink-faint)}
.imp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.imp-b{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 12px;border-radius:16px;border:1px solid var(--line-strong);font-size:13px;font-weight:500;color:var(--ink-soft);text-align:center}
.imp-b svg{width:30px;height:38px}
.imp-b[aria-pressed="true"]{border-color:var(--oak);background:var(--surface-2);color:var(--ink)}
.imp-b[aria-pressed="true"] svg{color:var(--oak)}
.score-read{display:flex;align-items:baseline;gap:8px}
.score-m{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.score-desc{font-size:13px;font-weight:600;color:var(--oak)}
.range{-webkit-appearance:none;appearance:none;width:100%;height:34px;margin:0;background:transparent;cursor:pointer}
.range::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,var(--tinto) 0 var(--p),var(--surface-2) var(--p) 100%);border:1px solid var(--line-strong)}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--oak);border:3px solid var(--surface);box-shadow:0 2px 8px var(--shadow)}
.range::-moz-range-track{height:8px;border-radius:4px;background:var(--surface-2)}
.range::-moz-range-progress{height:8px;border-radius:4px;background:var(--tinto)}
.range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--oak);border:3px solid var(--surface)}
.range-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-faint)}
.tag-b{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);font-size:13.5px}
.tag-b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fc)}
.tag-b[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
textarea{display:block;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface-2);resize:vertical;font:italic 500 18px/1.4 var(--display);color:var(--ink)}
textarea::placeholder{color:var(--ink-faint)}
.cc-head{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center}
.vaso{display:block;width:84px;height:auto}
.vaso-liq{transition:transform .7s var(--ease),fill .4s}
.cc-wine{margin-top:4px;font-size:13px;color:var(--ink-soft)}
.hint{margin-top:16px;padding-left:12px;border-left:2px solid var(--oak);font-size:13.5px;color:var(--ink-soft)}
.swatches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);font-size:12px;color:var(--ink-soft);text-align:center}
.sw i{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -6px 10px rgba(0,0,0,.22)}
.sw-otro{background:conic-gradient(#8E1B2E,#E2CF7E,#E8939A,#D9822B,#8E1B2E)}
.sw[aria-pressed="true"]{border-color:var(--oak);background:var(--surface-2);color:var(--ink)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.scale button.fill{background:color-mix(in srgb,var(--tinto) 42%,var(--surface-2));border-color:transparent}
.scale button.on{background:var(--tinto);border-color:var(--tinto)}
.scale-l{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--ink-faint)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg3 button{height:44px;border-radius:12px;border:1px solid var(--line-strong);font-weight:500;text-align:center}
.seg3 button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.need{margin-top:16px;font-size:13px;color:var(--ink-faint)}
.wheel{display:block;width:min(100%,300px);height:auto;margin:10px auto 0}
.wheel .seg{cursor:pointer;outline:none;transition:transform .22s var(--ease)}
.wheel .seg:focus-visible path{stroke:var(--oak);stroke-width:3}
.fam-box{margin-top:12px;min-height:40px}
.fam-empty{text-align:center;font-size:13px;color:var(--ink-faint)}
.muted{font-size:13px;color:var(--ink-faint)}
.score-hero{display:flex;flex-direction:column;align-items:center;margin:20px 0 4px}
.score-xl{font:700 78px/1 var(--display);font-variant-numeric:tabular-nums}

/* Revelado */
.saved-head{display:flex;gap:14px;align-items:center;margin:2px 0 16px}
.saved-head .check{flex:none;width:44px;height:44px;color:var(--oak)}
.check path{stroke-dasharray:40;animation:draw2 .6s .1s var(--ease) backwards}
@keyframes draw2{from{stroke-dashoffset:40}}
.rev-top{display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px;align-items:center}
.rev-score{position:relative;width:100px;height:88px;display:grid;place-items:center;color:var(--tinto)}
.rev-score .hand,.pg-score .hand{position:absolute;inset:0;width:100%;height:100%}
.rev-n{position:relative;font:700 40px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.hand path{stroke-dasharray:240;animation:draw 1s .15s var(--ease) backwards}
@keyframes draw{from{stroke-dashoffset:240}}
.reveal-h{margin-bottom:10px;font-size:15px}
.tag.t-match{background:var(--oak);color:var(--oak-ink);font-weight:600}
.tag.t-fam{background:transparent;border:1px solid var(--oak)}
.tag.t-miss{background:transparent;border:1px dashed var(--line-strong);color:var(--ink-soft)}
.legend-s{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:var(--ink-faint)}
.lg{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:50%;vertical-align:-1px}
.lg.t-match{background:var(--oak)}
.lg.t-fam{border:1px solid var(--oak)}
.lg.t-miss{border:1px dashed var(--ink-faint)}
.pc-row{display:grid;grid-template-columns:78px auto;gap:6px 12px;padding:9px 0;border-bottom:1px solid var(--line)}
.pc-k{grid-row:span 2;align-self:center;font-size:13.5px}
.pc-v{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-faint)}
.pc-l{width:46px}
.cmp-line{font-size:14px}

/* Hoja de cuaderno */
.page{position:relative;display:block;width:100%;padding:16px 76px 14px 46px;border-radius:4px 14px 14px 4px;color:var(--paper-ink);text-align:left;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--paper-rule) 27px 28px);background-position:0 14px;box-shadow:0 10px 26px var(--shadow)}
.page::before{content:"";position:absolute;top:0;bottom:0;left:32px;width:1.5px;background:var(--paper-margin);opacity:.75}
.page::after{content:"";position:absolute;left:11px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--bg);box-shadow:0 30px 0 var(--bg),0 60px 0 var(--bg)}
.page-btn{cursor:pointer;transition:transform .22s var(--ease)}
.page-btn:hover{transform:translateY(-2px) rotate(-.3deg)}
.pg-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pg-date{font:600 10.5px/1.4 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--paper-soft)}
.pg-ej{padding:3px 5px;border:1.5px solid currentColor;border-radius:4px;font:700 9.5px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--paper-margin);transform:rotate(-3deg)}
.pg-name{margin:6px 0 0;font:600 23px/1.12 var(--display);text-wrap:balance}
.pg-meta{margin-top:3px;font-size:12.5px;color:var(--paper-soft)}
.pg-score{position:absolute;top:12px;right:10px;width:62px;height:56px;display:grid;place-items:center;color:var(--paper-margin)}
.pg-score span{position:relative;font:700 25px/1 var(--display);color:var(--paper-ink);font-variant-numeric:tabular-nums}
.pg-row{display:flex;gap:12px;align-items:center;margin-top:12px}
.pg-row:empty{display:none}
.blot{flex:none;width:44px;height:40px}
.blot svg{display:block;width:100%;height:100%}
.stamps{display:flex;flex-wrap:wrap;gap:6px}
.stamp{display:inline-block;padding:2px 7px;border:1.5px solid var(--fc);border-radius:3px;color:var(--fc);font:700 10.5px/1.5 var(--ui);letter-spacing:.08em;text-transform:uppercase;transform:rotate(var(--rot))}
.pg-nota{margin-top:10px;font:italic 500 18px/28px var(--display)}
.pg-foot{margin-top:10px;font-size:11.5px;color:var(--paper-soft)}
.pages{display:grid;gap:14px}

/* Cuaderno */
.cu-head{margin:4px 0 0}
.cu-stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--ink-soft)}
.cu-stats strong{margin-right:3px;font:700 21px/1 var(--display);color:var(--ink)}
.cu-sec{margin-top:28px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h .block-t{margin:0}
.sec-s{font-size:12px;color:var(--ink-faint)}
.mail{margin-top:18px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.mail-t{font:600 21px/1.2 var(--display)}
.mail-s{margin:4px 0 12px;font-size:13.5px;color:var(--ink-soft)}
.mail-row{display:flex;gap:8px}
.mail-row .btn{flex:0 0 auto}
.mail-row input{flex:1;min-width:0;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink)}
.mail-err{margin-top:8px;font-size:12.5px;color:var(--danger)}
.saved-mail{margin-top:16px;font-size:13px;color:var(--ink-soft)}
.noche{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.noche-d{margin-top:2px;font:600 20px/1.2 var(--display)}
.noche-copas{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:16px}
.nc{display:flex;flex-direction:column;align-items:center;gap:3px}
.nc .copita{width:26px;height:32px}
.nc b{font:700 16px/1 var(--display)}
.paladar-f{margin-top:10px;font:italic 500 19px/1.35 var(--display)}
.sellos{display:flex;flex-wrap:wrap;gap:12px}
.sello{position:relative;width:86px;height:86px;display:grid;place-items:center;color:var(--ink-faint);transform:rotate(var(--rot))}
.sello svg{position:absolute;inset:0;width:100%;height:100%}
.sello.on{color:var(--tinto)}
.sello-t{position:relative;max-width:60px;font:700 9.5px/1.25 var(--ui);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.cu-foot{margin-top:30px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.cu-foot .link{font-size:13px}
.muted-l{color:var(--ink-faint)}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.empty{padding:36px 12px 10px;text-align:center;color:var(--ink-soft)}
.empty svg{display:block;width:120px;height:auto;margin:0 auto 14px;color:var(--oak)}
.empty-t{margin-bottom:6px;font:600 25px/1.2 var(--display);color:var(--ink)}
.empty p{max-width:36ch;margin-inline:auto}
.empty .btn{margin-top:18px}

/* ¿Qué tomo? */
.qt-intro{padding:22px 4px 0;text-align:center}
.qt-intro svg{display:block;width:92px;height:auto;margin:0 auto 12px}
.qt-intro .sub{max-width:34ch;margin:8px auto 22px}
.qt-note{margin-top:14px;font-size:13px;color:var(--ink-faint)}
.qt-prog{display:flex;align-items:center;gap:6px;margin:10px 0 4px}
.qt-prog i{flex:1;height:3px;border-radius:2px;background:var(--line-strong)}
.qt-prog i.on{background:var(--oak)}
.qt-prog span{margin-left:8px;font-size:12px;color:var(--ink-faint);white-space:nowrap}
.back{display:inline-block;margin-top:6px}
.back-sp{height:14px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{position:relative;display:flex;flex-direction:column;gap:2px;padding:16px 46px 16px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:border-color .2s}
.opt:hover,.opt[aria-pressed="true"]{border-color:var(--oak)}
.opt-t{font:600 21px/1.2 var(--display)}
.opt-s{font-size:13px;color:var(--ink-soft)}
.opt-go{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--oak)}
.opt-go svg{width:18px;height:18px;display:block}
.recs{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px}
.rec{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr) 40px;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left}
.rec:hover{border-color:var(--oak)}
.rec-rank{font:600 22px/1 var(--ui);color:var(--oak);text-align:center}
.rec-main{min-width:0}
.rec-name{display:block;font:600 20px/1.15 var(--display)}
.rec-why{display:block;margin-top:4px;font-size:13.5px}
.rec-meta{display:block;margin-top:4px;font-size:12px;color:var(--ink-soft)}
.rec-b{height:84px;display:flex;justify-content:center}
.thinking{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 0;color:var(--ink-soft)}
.thinking svg{width:60px;height:auto;animation:swirl 1.1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes swirl{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

/* Tarjeta para llevar */
.story-wrap{display:flex;justify-content:center;margin:16px 0 10px}
.story-ph{width:min(62vw,260px);aspect-ratio:9/16;max-width:100%;display:grid;place-items:center;border-radius:16px;background:var(--surface-2);color:var(--ink-faint);font-size:13px}
.story-img{width:min(62vw,260px);height:auto;border-radius:16px;box-shadow:0 10px 30px var(--shadow)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(90%,420px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

function seed(){
  const now = new Date();

function paladar(){
  const liked = ultimasPorVino().filter(p => p.puntaje >= 86);

  return {X: liked.reduce((s, p) => s + p.snap.x, 0) / liked.length, Y: liked.reduce((s, p) => s + p.snap.y, 0) / liked.length, n: liked.length};

  const h = z.X < -18 ? 'frescos' : z.X > 18 ? 'complejos' : null;
  const v = z.Y > 18 ? 'potentes' : z.Y < -18 ? 'suaves' : null;
  const t = h && v ? 'los vinos ' + h + ' y ' + v : h ? 'los vinos ' + h : v ? 'los vinos ' + v : 'vinos de todo el mapa, sin un lado preferido';

function ultimaNoche(pages){
  const k = dayKey(new Date(pages[0].fecha));

  return {d: new Date(pages[0].fecha), pages: ps, esHoy: k === dayKey(new Date())};
}

    }

/* Revelado */
function comparar(p, w){
  const tus = p.aromas || [], somm = w.aromas_somm || [];
  const exact = somm.filter(a => tus.includes(a));
  const famT = new Set(tus.map(a => famDe(a) && famDe(a).id));
  const fam = somm.filter(a => !exact.includes(a) && famDe(a) && famT.has(famDe(a).id));
  const faltan = somm.filter(a => !exact.includes(a) && !fam.includes(a));
  return {exact, fam, faltan};
}
function revealAromas(p, w, compact){
  const s = w.aromas_somm;
  if (!s || !s.length) return '';
  const {exact, fam, faltan} = comparar(p, w);
  let head;
  if (exact.length > 1) head = 'Buen olfato: coincidiste con el sommelier en ' + exact.length + ' aromas.';
  else if (exact.length === 1) head = 'Coincidiste con el sommelier en <strong>' + esc(exact[0]) + '</strong>.';
  else if (fam.length) head = 'Ibas bien: el somm también encontró ' + famDe(fam[0]).nombre.toLowerCase() + '.';
  else head = 'Esta vez fueron por lados distintos. En la próxima copa buscá <strong>' + esc(faltan[0]) + '</strong>.';
  const leg = [];
  if (exact.length) leg.push('<span><i class="lg t-match"></i>Coincidieron</span>');
  if (fam.length) leg.push('<span><i class="lg t-fam"></i>Misma familia</span>');
  if (faltan.length) leg.push('<span><i class="lg t-miss"></i>Para buscar</span>');
  return '<div class="block"><p class="block-t">' + (compact ? 'El sommelier anotó' : 'Aromas') + '</p><p class="reveal-h">' + head + '</p><div class="tags">'
    + s.map(a => '<span class="tag ' + (exact.includes(a) ? 't-match' : fam.includes(a) ? 't-fam' : 't-miss') + '">' + esc(a) + '</span>').join('')
    + '</div><p class="legend-s">' + leg.join('') + '</p></div>';
}

/* ---------- ¿Qué tomo? ---------- */
function recomendar(ans){
  const pMax = Math.max(...WINES.map(w => w.copa));
  const z = paladar();
  return WINES.map(w => {
    let s = 0; const why = []; const p = w.perfil, m = w.maridaje.join(' ');
    if (ans.color === 'tinto') s += w.tipo === 'Tinto' ? 3 : -5;
    else if (ans.color === 'claro') s += w.tipo === 'Tinto' ? -5 : 3;
    else if (w.tipo !== 'Tinto' || /Criolla|Franc|Syrah/.test(w.varietal)) { s += 2; why.push(w.tipo !== 'Tinto' ? 'un ' + w.tipo.toLowerCase() + ' para salir de lo de siempre' : 'una cepa que no se pide tanto'); }
    if (ans.animo === 'fresco') { s += (p.frescura - 3) * 1.3 - (p.cuerpo - 3) * .9; if (p.frescura >= 4) why.push('fresco y fácil de tomar'); }
    else if (ans.animo === 'estructura') { s += (p.cuerpo - 3) * 1.3 + (p.taninos - 3) * .7; if (p.cuerpo >= 4) why.push('tiene cuerpo y estructura'); }
    if (ans.comida === 'tabla') { if (/queso|embutid|charcut|picada|fiambre|jam/.test(m)) { s += 1.5; why.push('va muy bien con la tabla'); } }
    else if (ans.comida === 'contundente') { if (/carne|cordero|caza|guiso|cerdo/.test(m)) { s += 1.5; why.push('acompaña carnes y platos intensos'); } }
    else if (ans.comida === 'solo' && p.cuerpo <= 3) { s += .8; why.push('se disfruta solo'); }
    if (ans.precio === 'accesible') s += w.copa <= 4500 ? 2 : w.copa <= 7000 ? -.5 : -3;
    else if (ans.precio === 'medio') s += w.copa > 4500 && w.copa <= 7000 ? 2 : w.copa <= 4500 ? .3 : -1;
    else { s += w.copa >= 7000 ? 2 : -.8; if (w.copa === pMax) { s += .8; why.push('es lo más especial de la carta'); } }
    const probado = !!ultimaPagina(w.id);
    if (z && !probado) { const d = Math.hypot(w.x - z.X, w.y - z.Y); if (d < 70) { s += 1.2 * (1 - d / 70); why.push('queda cerca de lo que te viene gustando'); } }
    if (probado) s -= .6;
    return {w, s, why};
  }).sort((a, b) => b.s - a.s).slice(0, 3).map(r => {
    const u = [...new Set(r.why)].slice(0, 2);
    const ar = (r.w.aromas_somm || []).slice(0, 2);
    const notas = ar.length ? ' Notas de ' + ar.join(' y ') + '.' : '';
    return {w: r.w, why: (u.length ? cap(u.join(', ')) + '.' : 'Equilibrado y fácil de acompañar.') + notas};
  });
}

function wrapLines(g, text, max){
  const words = text.split(' '), lines = []; let cur = '';
  words.forEach(wd => { const t = cur ? cur + ' ' + wd : wd; if (g.measureText(t).width > max && cur) { lines.push(cur); cur = wd; } else cur = t; });
  if (cur) lines.push(cur);
  return lines;
}

    if (!p) { requestClose(); return; }
    const w = byId(p.vinoId);
    body = '<p class="eyebrow" id="sheet-title">Página del cuaderno</p><div class="block">' + pageCard(p) + '</div>'
      + (w ? revealAromas(p, w, true) : '')
      + (p.perfil && w ? '<div class="block"><p class="block-t">En boca <span>vos y la ficha de la bodega</span></p>' + perfilCompare(p.perfil, w.perfil, w.tipo) + '</div>' : '');
    foot = S.confirm
      ? '<div class="confirm"><p>¿Borrar esta página del cuaderno?</p><button class="btn btn-ghost sm" data-act="borrar-no">Cancelar</button><button class="btn btn-danger sm" data-act="borrar-si">Sí, borrar</button></div>'
      : '<button class="btn btn-ghost" data-act="borrar-pagina">Borrar</button>' + (w ? '<button class="btn btn-primary" data-act="ficha" data-id="' + w.id + '">Ver el vino</button>' : '');
  } else if (S.mode === 'noche') {
    const pages = [...store.pages].sort((a, b) => b.fecha.localeCompare(a.fecha)), n = ultimaNoche(pages);
    body = '<p class="eyebrow">Llevate tu noche</p><h2 class="h3" id="sheet-title">' + (n.esHoy ? 'Mi noche' : 'Mi última noche') + ' en 125cc</h2><div class="story-wrap" id="story-wrap"><div class="story-ph">Armando la imagen…</div></div><p class="sub center">Para guardarla, mantené apretada la imagen o sacale una captura.</p>';
    storyURL(n).then(url => { const sw = $('#story-wrap'); if (sw && ui.sheet && ui.sheet.mode === 'noche') sw.innerHTML = '<img class="story-img" src="' + url + '" alt="Tarjeta de tu noche en 125cc con ' + n.pages.length + ' vinos y sus puntajes">'; }).catch(() => { const sw = $('#story-wrap'); if (sw) sw.innerHTML = '<p class="muted">No se pudo armar la imagen en este navegador.</p>'; });
  }
  sBody.innerHTML = body; sFoot.innerHTML = foot;
  sBody.scrollTop = keepScroll ? st : 0;
  if (S.mode === 'revelado') animarPuntaje();
}
function openSheet(mode, data){
  ui.sheet = Object.assign({mode}, data || {});
  renderSheet(false);
  if (!sheetOpen) {
    sheetOpen = true; sheet.hidden = false; scrim.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => { sheet.classList.add('open'); scrim.classList.add('open'); }));
    document.body.classList.add('locked');
    try { history.pushState({sheet: 1}, ''); pushed = true; } catch (e) { pushed = false; }
    setTimeout(() => { try { sheet.focus({preventScroll: true}); } catch (e) {} }, 60);
  }
}
function hideSheet(){
  sheetOpen = false; ui.sheet = null; ui.cata = null;
  sheet.classList.remove('open'); scrim.classList.remove('open'); document.body.classList.remove('locked');
  setTimeout(() => { if (!sheetOpen) { sheet.hidden = true; scrim.hidden = true; sheet.style.transform = ''; } }, 400);
  refresh();
}
function requestClose(){ if (pushed) { pushed = false; history.back(); setTimeout(() => { if (sheetOpen) hideSheet(); }, 350); } else hideSheet(); }
addEventListener('popstate', () => { if (sheetOpen) { pushed = false; hideSheet(); } });
(() => {
  const grab = $('#sheet-grab'); let drag = null;
  grab.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; drag = {y: e.clientY, dy: 0}; sheet.style.transition = 'none'; try { grab.setPointerCapture(e.pointerId); } catch (er) {} });
  grab.addEventListener('pointermove', e => { if (!drag) return; drag.dy = Math.max(0, e.clientY - drag.y); sheet.style.transform = 'translateY(' + drag.dy + 'px)'; });
  const end = () => { if (!drag) return; const close = drag.dy > 110; drag = null; sheet.style.transition = ''; sheet.style.transform = ''; if (close) requestClose(); };
  grab.addEventListener('pointerup', end); grab.addEventListener('pointercancel', end);
})();

/* ---------- Vistas ---------- */
function updateBadge(){ const b = $('#badge'), n = store.pages.length; b.hidden = !n; b.textContent = n; }
function refresh(){
  if (ui.view === 'carta') renderCarta();
  if (ui.view === 'cuaderno') renderCuaderno();
  if (ui.view === 'que-tomo') renderQueTomo();
  updateBadge();
}
function showView(v){
  ui.view = v; ui.confirm = null;
  ['carta','que-tomo','cuaderno'].forEach(k => { $('#view-' + k).hidden = k !== v; const nb = $('#nav-' + k); if (k === v) nb.setAttribute('aria-current', 'page'); else nb.removeAttribute('aria-current'); });
  refresh();
  window.scrollTo(0, 0);
  try { history.replaceState(history.state, '', '#' + v); } catch (e) {}
}
function applyTheme(){
  const root = document.documentElement;
  if (store.theme) root.setAttribute('data-theme', store.theme);
  const dark = (root.getAttribute('data-theme') || 'dark') !== 'light';
  const btn = $('#theme-btn');
  btn.setAttribute('aria-label', dark ? 'Pasar a modo día' : 'Pasar a modo noche');
  btn.innerHTML = dark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
}

/* ---------- Acciones ---------- */
const ACT = {
  view: (t, v) => { if (sheetOpen) hideSheet(); showView(v); },
  ficha: (t, v, id) => { openSheet('ficha', {id: +id}); haptic(); },
  filtro: (t, v) => { ui.filtro = v; renderCarta(); },
  faltan: () => { ui.faltan = !ui.faltan; renderCarta(); },
  ampliar: () => openSheet('mapa'),
  anotar: (t, v, id) => { ui.cata = nuevaCata(+id); openSheet('rapida'); },
  imp: (t, v) => {
    const c = ui.cata; c.impresion = v;
    if (!c.tocoPuntaje) setScore(PRESET[v]);
    sBody.querySelectorAll('[data-act="imp"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
    const g = $('#btn-guardar'); if (g) g.disabled = false;
    haptic();
  },
  'aroma-q': (t, v) => {
    const c = ui.cata; c.aromas = c.aromas.length === 1 && c.aromas[0] === v ? [] : [v];
    sBody.querySelectorAll('[data-act="aroma-q"]').forEach(b => b.setAttribute('aria-pressed', String(c.aromas.includes(b.dataset.v))));
    haptic();
  },
  'guardar-rapida': () => {
    const c = ui.cata;
    const p = mkPage(c.vinoId, {modo: 'rapida', impresion: c.impresion, puntaje: c.puntaje, aromas: c.aromas.slice(), nota: c.nota.trim()});
    store.pages.push(p); save(); ui.cata = null; updateBadge();
    openSheet('guardado', {pageId: p.id}); haptic(16); refresh();
  },
  completa: () => { ui.cata.modo = 'completa'; ui.cata.step = 0; openSheet('completa'); },
  color: (t, v) => { ui.cata.color = v; renderStep(true); haptic(); },
  esc: (t, v) => { const c = ui.cata, k = t.dataset.k; if (k in c.perfil) c.perfil[k] = +v; else c[k] = +v; renderStep(true); haptic(); },
  fam: (t, v) => { ui.cata.fam = ui.cata.fam === v ? null : v; renderStep(true); haptic(); },
  aroma: (t, v) => { const c = ui.cata; c.aromas = c.aromas.includes(v) ? c.aromas.filter(a => a !== v) : c.aromas.concat(v); renderStep(true); haptic(); },
  final: (t, v) => { ui.cata.final = v; renderStep(true); },
  repetir: (t, v) => { ui.cata.repetiria = v; renderStep(true); },
  'paso-ant': () => { const c = ui.cata; if (c.step === 0) { c.modo = 'rapida'; openSheet('rapida'); } else { c.step--; renderStep(false); } },
  'paso-sig': () => {
    const c = ui.cata;
    if (c.step < 4) { c.step++; renderStep(false); return; }
    const imp = c.puntaje >= 90 ? 'encanto' : c.puntaje >= 80 ? 'gusto' : 'no';
    const p = mkPage(c.vinoId, {modo: 'completa', impresion: imp, puntaje: c.puntaje, color: c.color, intensidad: c.intensidad, aromas: c.aromas.slice(), intAroma: c.intAroma, perfil: Object.assign({}, c.perfil), final: c.final, repetiria: c.repetiria, nota: c.nota.trim()});
    store.pages.push(p); save(); ui.cata = null; updateBadge();
    openSheet('revelado', {pageId: p.id}); haptic(20); refresh();
  },
  pagina: (t, v, id) => openSheet('pagina', {pageId: id}),
  'borrar-pagina': () => { ui.sheet.confirm = true; renderSheet(true); },
  'borrar-no': () => { ui.sheet.confirm = false; renderSheet(true); },
  'borrar-si': () => { const id = ui.sheet.pageId; store.pages = store.pages.filter(p => p.id !== id); save(); requestClose(); toast('Página borrada'); },
  noche: () => openSheet('noche'),
  'quiz-start': () => { ui.quiz = {step: 0, ans: {}}; renderQueTomo(); window.scrollTo(0, 0); },
  'quiz-ans': (t, v) => {
    const q = ui.quiz; q.ans[QUIZ[q.step].k] = v; haptic();
    if (q.step < QUIZ.length - 1) { q.step++; renderQueTomo(); window.scrollTo(0, 0); return; }
    q.step = 'pensando'; renderQueTomo();
    setTimeout(() => { if (ui.quiz.step === 'pensando') { ui.quiz.step = QUIZ.length; renderQueTomo(); window.scrollTo(0, 0); } }, reduced() ? 0 : 900);
  },
  'quiz-back': () => { ui.quiz.step = Math.max(0, ui.quiz.step - 1); renderQueTomo(); },
  'quiz-reset': () => { ui.quiz = {step: 0, ans: {}}; renderQueTomo(); window.scrollTo(0, 0); },
  cerrar: () => requestClose(),
  theme: () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'dark';
    store.theme = cur === 'light' ? 'dark' : 'light'; save(); applyTheme();
  },
  'borrar-ejemplos': () => { store.pages = store.pages.filter(p => !p.ejemplo); save(); refresh(); toast('Listo: quedan solo tus páginas'); },
  reset: () => { ui.confirm = 'reset'; renderCuaderno(); },
  cancelar: () => { ui.confirm = null; renderCuaderno(); },
  'reset-si': () => { store.pages = []; ui.confirm = null; save(); refresh(); toast('Cuaderno en blanco'); },
  'ir-cuaderno': () => { hideSheet(); showView('cuaderno'); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.act];
  if (fn) fn(t, t.dataset.v, t.dataset.id, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetOpen) { requestClose(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) {
    e.preventDefault();
    e.target.dispatchEvent(new MouseEvent('click', {bubbles: true}));
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'score-r' && ui.cata) { ui.cata.tocoPuntaje = true; setScore(+e.target.value); }
  if (e.target.id === 'nota-txt' && ui.cata) ui.cata.nota = e.target.value;
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'mail-form') return;
  e.preventDefault();
  const v = $('#mail-in').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { $('#mail-err').hidden = false; return; }
  store.email = v; save(); renderCuaderno(); toast('Listo. En el prototipo queda en este navegador.');
});

/* ---------- Arranque ---------- */
load();
applyTheme();
const h = (location.hash || '').slice(1);
showView(['carta','que-tomo','cuaderno'].includes(h) ? h : 'carta');
})();
</script>
