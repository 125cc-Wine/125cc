function buildMiCataCard(c, idx){
  const id   = 'mc_' + idx;
  const punt = c.puntuacion || c.puntuaci_n || c.rating || '—';
  const vino = c.vino || '—';
  const nivel= (c.nivel||'').toLowerCase();
  const fecha= fmtMiCataFecha(c.fecha);
  const color= c.color || '';
  const aromas = c.aromas || '';
  const sabor  = c.sabor  || '';
  const desc   = c.descripcion || c.opinion || '';
  const rep    = c.repetiria || '';

  const chips = (txt) => txt ? txt.split(',').filter(s=>s.trim()).slice(0,5)
    .map(s=>`<span style="display:inline-block;padding:4px 10px;border-radius:var(--r-surface);font-size:var(--text-kicker);background:var(--bg);border:1px solid var(--line);color:var(--ink);margin:2px">${esc(s.trim())}</span>`).join('') : '';

  const puntColor = punt>=90?'#4CAF50':punt>=80?'#C4A05A':punt>=70?'#FF9800':'#888';

  return `<div class="wine-card" id="${id}" onclick="toggleMiCataCard('${id}')" style="cursor:pointer;margin-bottom:10px;flex-direction:column;align-items:stretch">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="text-align:center;flex-shrink:0;width:52px">
        <div style="font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:${puntColor};line-height:1">${esc(punt)}</div>
        <div style="font-size:9px;color:var(--ink-3);letter-spacing:.05em">/100</div>
      </div>
      <div style="flex:1;min-width:0">

function fmtMiCataFecha(f){
  if(!f) return '';
  const s = f.toString();
  const dmy = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  if(dmy) return dmy[1].padStart(2,'0') + '/' + dmy[2].padStart(2,'0') + '/' + dmy[3];
  if(s.includes('T') || (s.includes('-') && s.length > 8)){
    const d = new Date(s);
    if(!isNaN(d.getTime())){
      return d.getDate().toString().padStart(2,'0') + '/' +
             (d.getMonth()+1).toString().padStart(2,'0') + '/' +
             d.getFullYear();
    }
  }
  return s;
}

function editarCata(idx){
  const c = _misCatasAll[idx];
  if(!c || !c.id) return;

  const aromasArr = (c.aromas||'').split(',').map(s=>s.trim()).filter(Boolean);
  const saborArr  = (c.sabor ||'').split(',').map(s=>s.trim()).filter(Boolean);
  const w = wines.find(w=>w.nombre===c.vino);

  cataState = {
    nivel: (c.nivel||'').toLowerCase()==='sommelier' ? 'sommelier' : 'simple',
    step: 1,
    vinoId: w ? w.id : (wines[0] ? wines[0].id : null),
    email: c.email || cataState.email,
    color: c.color || null, colorOtro:'',
    aromas: aromasArr, aromasOtro:'',
    sabor: saborArr, saborOtro:'',
    acidez:   Number(c.acidez)   || 3,
    taninos:  Number(c.taninos)  || 3,
    cuerpo:   Number(c.cuerpo)   || 3,
    final:    Number(c.final_boca||c.final_en_boca) || 3,
    visual:   Number(c.visual)   || 3,
    olfativo: Number(c.gusto||c.olfativo) || 3,
    puntuacion: Number(c.puntuacion) || 80,
    descripcion: c.descripcion || c.opinion || '',
    repetiria: c.repetiria || '',

}

      <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:2px;transition:width .4s ease"></div>
    </div>
  </div>`;
}

const NAVBTN = (back,label,fn,gold=false)=>`<button onclick="${fn}" style="flex:${back?1:2};background:${back?'transparent':`linear-gradient(135deg,${gold?'var(--madera),#E8C878':'var(--accent),var(--accent-2)'})`};border:${back?'1px solid var(--line-dark-strong)':'none'};border-radius:var(--r-pill);padding:14px;font-size:12px;${back?'':'font-weight:500;'}color:${back?'var(--ink-dark-3)':(gold?'var(--dark)':'#fff')};cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;${gold&&!back?'box-shadow:0 4px 16px rgba(196,160,90,.25)':''};transition:transform var(--t-feedback) var(--ease)">${label}</button>`;

function renderFormPuntuar(){
  if(!wines.length)return;
  if(!cataState.vinoId){
    const w=selectedId?wines.find(w=>w.id===selectedId):wines[0];
    if(w)cataState.vinoId=w.id;
  }
  renderCataStep();
}

function renderCataStep(){
  const c=document.getElementById('puntuarContent'); if(!c)return;
  if(!cataState.nivel){c.innerHTML=renderCataWelcome();return;}
  if(cataState.nivel==='simple') renderStepSimple();
  else renderStepSommelier();
}

/* ── Selección de vino a catar — hero con la botella + picker con imagen, bodega y precio ── */
let cataWinePickerOpen = false;
let cataWineSearch = '';

function buildCataWineHero(){
  const w = cataState.vinoId ? wines.find(x=>x.id===cataState.vinoId) : null;
  if(!w){
    return `<div onclick="toggleCataWinePicker()" style="text-align:center;padding:14px;color:var(--ink-dark-3);font-size:var(--text-data);cursor:pointer;border:1px dashed rgba(255,255,255,.15);border-radius:var(--r-card)">Elegí un vino para catar →</div>${buildCataWinePickerWrap()}`;
  }
  const color = TYPE_COLOR[w.tipo] || '#888';
  const thumb = w.imagen
    ? `<img src="${esc(w.imagen)}" alt="" loading="lazy" onerror="this.remove()" style="width:56px;height:56px;border-radius:var(--r-sm);object-fit:contain;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);flex-shrink:0">`
    : `<div style="width:56px;height:56px;border-radius:var(--r-sm);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);flex-shrink:0;display:flex;align-items:center;justify-content:center">${copitaSVG(color,{size:24})}</div>`;
  return `<div onclick="toggleCataWinePicker()" style="display:flex;align-items:center;gap:14px;cursor:pointer">
    ${thumb}
    <div style="flex:1;min-width:0">
      <div style="font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--ink-dark);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(w.nombre)}</div>
      <div style="font-size:12px;color:var(--ink-dark-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(w.bodega)} · ${esc(TYPE_LABEL[w.tipo]||w.tipo)} · ${fmtPrecio(w.precio)}</div>
    </div>
    <div style="flex-shrink:0;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--madera);border:1px solid rgba(196,160,90,.3);border-radius:var(--r-pill);padding:6px 12px">Cambiar</div>
  </div>${buildCataWinePickerWrap()}`;
}

function toggleCataWinePicker(force){
  cataWinePickerOpen = typeof force==='boolean' ? force : !cataWinePickerOpen;
  if(!cataWinePickerOpen) cataWineSearch = '';
  const wrap = document.getElementById('cataWinePickerWrap');
  if(wrap) wrap.outerHTML = buildCataWinePickerWrap();
  if(cataWinePickerOpen) setTimeout(()=>{ const i=document.getElementById('cataWineSearchInput'); if(i) i.focus(); }, 50);
}

function buildCataWinePickerWrap(){
  if(!cataWinePickerOpen) return `<div id="cataWinePickerWrap"></div>`;
  return `<div id="cataWinePickerWrap" style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);animation:fadeUp .2s ease">
    <input id="cataWineSearchInput" type="text" value="${esc(cataWineSearch)}" placeholder="Buscar vino o bodega..." oninput="onCataWineSearch(this.value)"
      style="width:100%;background:var(--dark-3);border:1px solid rgba(255,255,255,.1);border-radius:var(--r-card);padding:11px 14px;font-size:13px;color:var(--ink-dark);font-family:'DM Sans',sans-serif;outline:none;margin-bottom:8px">
    <div id="cataWinePickList" style="max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:2px">${buildCataWinePickList()}</div>
  </div>`;
}

function onCataWineSearch(v){
  cataWineSearch = v;
  const list = document.getElementById('cataWinePickList');
  if(list) list.innerHTML = buildCataWinePickList();
}

function buildCataWinePickList(){
  const q = normalizeSearch(cataWineSearch);
  const filtered = q ? wines.filter(w=>normalizeSearch(w.nombre).includes(q)||normalizeSearch(w.bodega).includes(q)) : wines;
  if(!filtered.length) return `<div style="text-align:center;padding:20px 0;color:var(--ink-dark-3);font-size:var(--text-kicker)">No encontramos vinos para "${esc(cataWineSearch)}"</div>`;
  return filtered.map(w=>{
    const active = w.id===cataState.vinoId;
    const color = TYPE_COLOR[w.tipo] || '#888';
    const thumb = w.imagen
      ? `<img src="${esc(w.imagen)}" alt="" loading="lazy" onerror="this.remove()" style="width:34px;height:34px;border-radius:var(--r-sm);object-fit:contain;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);flex-shrink:0">`
      : `<div style="width:34px;height:34px;flex-shrink:0"></div>`;
    return `<div onclick="selectCataWine(${w.id})" style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-card);cursor:pointer;background:${active?'rgba(196,160,90,.12)':'transparent'};border:1px solid ${active?'var(--madera)':'transparent'};transition:background .15s">
      ${copitaSVG(color,{size:15,state:active?'selected':'filled',selected:active})}
      ${thumb}
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;color:var(--ink-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(w.nombre)}</div>
        <div style="font-size:10px;color:var(--ink-dark-3)">${esc(w.bodega)} · ${esc(TYPE_LABEL[w.tipo]||w.tipo)}</div>
      </div>
      <div style="font-size:11px;color:var(--ink-dark-2);flex-shrink:0">${fmtPrecio(w.precio)}</div>
    </div>`;
  }).join('');
}

function selectCataWine(id){
  cataState.vinoId = id;
  cataWinePickerOpen = false;
  cataWineSearch = '';
  const hero = document.getElementById('cataWineHero');
  if(hero) hero.innerHTML = buildCataWineHero();
}

function startCata(nivel){
  // Tomar email del input
  const emailEl=document.getElementById('cata-email-input');
  if(emailEl) cataState.email=emailEl.value.trim();
  cataState.nivel=nivel; cataState.step=1; cataNavDir='next';
  renderCataStep();
}

let cataNavDir = 'next'; // dirección del último paso navegado — anima la entrada de stepCard en consecuencia

function stepCard(paso,label,titulo,hint,content,tip){
  const anim = cataNavDir==='back' ? 'stepEnterBack' : 'stepEnterNext';
  return `<div style="background:var(--dark-2);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-surface);margin:14px 16px;padding:22px;animation:${anim} .38s cubic-bezier(.22,1,.36,1)">
    <div style="font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--madera);margin-bottom:4px">${paso}</div>
    <div style="font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--ink-dark);margin-bottom:4px;line-height:1.2">${titulo}</div>
    <div style="font-size:var(--text-caption);color:var(--ink-dark-3);margin-bottom:20px">${hint}</div>
    ${content}
    ${tip ? helpBox(tip) : ''}
  </div>`;
}

/* Ayuda contextual breve para quien nunca cató — se muestra debajo del contenido del paso */
function helpBox(text){
  return `<div style="margin-top:16px;padding:11px 13px;background:rgba(196,160,90,.08);border:1px solid rgba(196,160,90,.15);border-radius:var(--r-card);display:flex;gap:9px;align-items:flex-start">
    <span style="flex-shrink:0;font-size:13px;line-height:1.5">💡</span>
    <span style="font-size:var(--text-kicker);color:var(--ink-dark-3);line-height:1.65">${text}</span>
  </div>`;
}

    ${NAVBTN(true,'← '+(s===1?'Cambiar nivel':'Anterior'),'cataNavBack()')}
    ${s<T?NAVBTN(false,'Siguiente →',`cataNavNext(${T})`):(cataState.editingId?NAVBTN(false,'💾 Guardar cambios','guardarEdicionCata()'):NAVBTN(false,'🍷 Guardar cata','enviarPuntuacion()'))}

  else if(s===3) h+=stepCard('Paso 3 de 4','','Sensaciones en boca','¿Qué sentís al probarlo?',`<div id="saborGrid" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">${buildChips(['Ácido','Dulce','Amargo','Tánico','Untuoso','Fresco','Cálido','Seco','Frutal','Especiado','Mineral'],cataState.sabor,'toggleSabor')}${buildOtroField('saborOtro','cataState.saborOtro','Otra sensación...')}</div><div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--madera);margin-bottom:8px">Descripción libre</div><textarea id="cata-desc" rows="3" placeholder="Anotá lo que sentís…" oninput="cataState.descripcion=this.value" style="width:100%;background:var(--dark-3);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-card);padding:12px 14px;font-size:var(--text-data);color:var(--ink-dark);font-family:'DM Sans',sans-serif;outline:none;resize:none;line-height:1.6">${cataState.descripcion}</textarea>`,'¿Te seca la lengua? Es tánico. ¿Te dan ganas de tomar agua? Es ácido. No hay respuesta incorrecta, es lo que vos sentís.');
  else if(s===4) h+=stepCard('Paso 4 de 4','','Puntuación','Escala 60–100 estilo Parker',buildScoreSlider('simple',cataState.puntuacion),'No hay una nota correcta — puntuá según cuánto lo disfrutaste. 80 ya es un vino bueno; abajo de 70 es porque algo no te cerró.');

    <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--madera);margin-bottom:8px">Descripción libre <span style="opacity:.6;font-weight:300;text-transform:none;letter-spacing:0">· opcional</span></div>
    <textarea id="cata-desc" rows="4" placeholder="Fresco, muy tomable, especiado, le faltó cuerpo… lo que sea que sentiste." oninput="cataState.descripcion=this.value" style="width:100%;background:var(--dark-3);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-card);padding:12px 14px;font-size:var(--text-data);color:var(--ink-dark);font-family:'DM Sans',sans-serif;outline:none;resize:none;line-height:1.6">${cataState.descripcion}</textarea>

  c.innerHTML=h+navBtns;
}

function cataNavNext(total){
  if(cataState.step<total){ cataNavDir='next'; cataState.step++; renderCataStep(); const e=document.getElementById('puntuarContent'); if(e)e.scrollIntoView({behavior:'smooth',block:'start'}); }
}
function cataNavBack(){
  cataNavDir='back';
  if(cataState.step<=1){cataState.nivel=null;cataState.step=0;} else cataState.step--;
  renderCataStep();
}

function normalizarTelefono(phone){
  if(!phone) return '';
  let p = phone.toString().replace(/[^\d+]/g,'');
  if(p.startsWith('0')) p = '+54' + p.slice(1);
  if(!p.startsWith('+')) p = '+54' + p;
  return p;
}
function ratingText(n){ return CATA_SCORE_LABELS[n]||''; }

/* Momento de revelación: el puntaje se arma en cámara lenta en vez de aparecer de golpe */
function animateRevealScore(target){
  const el = document.getElementById('revealScore');
  const lbl = document.getElementById('revealLabel');
  if(!el) return;
  target = Math.round(target);
  const start = Math.max(60, target - 22);
  const duration = 750;
  const t0 = performance.now();
  function tick(now){
    const p = Math.min(1, (now - t0) / duration);
    const eased = 1 - Math.pow(1 - p, 3);
    const val = Math.round(start + (target - start) * eased);
    el.textContent = val;
    if(lbl) lbl.textContent = ratingText(val) || '';
    if(p < 1) requestAnimationFrame(tick);
    else { el.textContent = target; if(lbl) lbl.textContent = ratingText(target) || ''; }
  }
  requestAnimationFrame(tick);
}

  t.textContent = (ok ? '✓ ' : '⚠️ ') + msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 2900);
}

function mostrarPopupBorrarCata(id, idx){
  let overlay = document.getElementById('delOverlay');
  if(overlay) overlay.remove();

  overlay = document.createElement('div');
  overlay.id = 'delOverlay';
  overlay.className = 'wa-overlay';
  overlay.innerHTML = `
    <div class="wa-sheet">
      <h3>¿Borrar esta cata?</h3>
      <p>Se va a eliminar de tu historial para siempre. Esta acción no se puede deshacer.</p>
      <button class="wa-send-btn" id="delConfirmBtn" style="background:var(--accent);box-shadow:0 4px 16px rgba(200,70,58,.25)" onclick="ejecutarBorrarCata('${esc(id)}', ${idx})">
        Sí, borrar cata
      </button>
      <button class="wa-skip-btn btn-terciario" onclick="cerrarPopupBorrarCata()">
        Cancelar
      </button>
    </div>`;

  overlay.addEventListener('click', function(e){
    if(e.target === overlay) cerrarPopupBorrarCata();
  });

  document.body.appendChild(overlay);
}

function cerrarPopupBorrarCata(){
  const overlay = document.getElementById('delOverlay');
  if(overlay) overlay.remove();
}

async function ejecutarBorrarCata(id, idx){
  const btn = document.getElementById('delConfirmBtn');
  if(btn){ btn.textContent = 'Borrando...'; btn.style.opacity = '.6'; btn.style.pointerEvents = 'none'; }

  const c = _misCatasAll[idx];
  const email = (c && c.email) || (function(){ try{ return localStorage.getItem('125cc_email')||''; }catch(e){return '';} })();

  try{
    const res = await fetch('/api/borrar-cata', {
      method: 'DELETE',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ id, email }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || data.error || 'Error desconocido');

    cerrarPopupBorrarCata();
    buscarMisCatas(email); // re-fetch para reflejar el borrado en la lista
  } catch(err){
    cerrarPopupBorrarCata();
    alert('No se pudo borrar la cata.\n\n' + err.message);
  }
}
