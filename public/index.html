<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="theme-color" content="#2A333C"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta property="og:title" content="125cc Wine Bar · Carta de Vinos"/>
  <meta property="og:description" content="Elegí tu vino por estilo, intensidad y perfil. Carta visual interactiva."/>
  <meta property="og:url" content="https://www.125cc.com.ar"/>
  <meta property="og:type" content="website"/>
  <title>Wine Bar · Carta de Vinos</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232A333C'/><path d='M11 4 C11 4 8.5 10 8.5 13.5 C8.5 17.5 11.5 20 15.5 20.5 L15.5 26 L12.5 26 L12 28.5 L20 28.5 L19.5 26 L16.5 26 L16.5 20.5 C20.5 20 23.5 17.5 23.5 13.5 C23.5 10 21 4 21 4 Z' fill='%23c8463a'/></svg>"/>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232A333C'/><path d='M11 4 C11 4 8.5 10 8.5 13.5 C8.5 17.5 11.5 20 15.5 20.5 L15.5 26 L12.5 26 L12 28.5 L20 28.5 L19.5 26 L16.5 26 L16.5 20.5 C20.5 20 23.5 17.5 23.5 13.5 C23.5 10 21 4 21 4 Z' fill='%23c8463a'/></svg>"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      /* ── Color · fondos y tinta ─────────────────────────────── */
      --bg: #FAF5EE;            /* fondo crema */
      --bg2: #F0E8DA;           /* superficie arena (hero ficha, zonas destacadas) */
      --surface: #FFFFFF;       /* cards */
      --ink: #151A1E;           /* texto principal (nunca #000) */
      --ink-2: #384551;         /* texto secundario */
      --ink-3: #60758A;         /* texto terciario / data */
      --dark: #2A333C;          /* superficie oscura (bodega, modo cata, preview mapa) */
      --dark-2: #323D48;        /* superficie oscura elevada */
      --dark-3: #3F4D5A;        /* superficie oscura elevada 2 (inputs/chips dentro del modo cata) */
      --dark-cata: #1D242A;     /* fondo del ritual de cata */
      --ink-dark: #F5EDE0;      /* texto sobre oscuro */
      --ink-dark-2: #D2B470;    /* texto secundario sobre oscuro */
      --ink-dark-3: rgba(245, 237, 224, .58); /* texto terciario sobre oscuro — NO usar --ink-3 (gris-azulado) acá, se pierde contra el azul de --dark-2/--dark-3 */

      /* ── Color · materiales del local ───────────────────────── */
      --madera: #CFAC59;
      --madera-dk: #455463;
      --piedra: #C4785A;
      --cuero: #A0622A;

      /* ── Color · acento (SOLO interactivo) ──────────────────── */
      --accent: #7A1428;
      --accent-2: #9B2035;
      --accent-grad: linear-gradient(135deg, #7A1428, #9B2035);
      --accent-bright: #E8677A; /* variante clara de --accent para texto sobre fondo oscuro (--accent solo tiene contraste sobre claro) */

      /* ── Color · tipos de vino (única fuente de verdad) ────── */
      --tinto: #7A1428;
      --blanco: #5A8A2A;
      --rosado: #C4306A;
      --naranja: #C46020;

      /* ── Bordes ─────────────────────────────────────────────── */
      --line: rgba(69, 84, 99, .15);       /* hairline en claro */
      --line-strong: rgba(69, 84, 99, .24);
      --line-dark: rgba(207, 172, 89, .18); /* hairline en oscuro */
      --line-dark-strong: rgba(207, 172, 89, .32);

      /* ── Tipografía · escala modular 1.25 / base 16 ─────────── */
      --font-serif: 'Cormorant Garamond', serif;
      --font-sans: 'DM Sans', sans-serif;
      --text-display: 48px;   /* Cormorant 700 — hero */
      --text-title: 32px;     /* Cormorant 600 — título de pantalla */
      --text-heading: 25px;   /* Cormorant 600 — sección */
      --text-name: 20px;      /* Cormorant 600 — nombre de vino en card, precio */
      --text-voice: 17px;     /* Cormorant 400 italic — voz del somm */
      --text-body: 15px;      /* DM Sans 300 */
      --text-data: 13px;      /* DM Sans 400 — datos técnicos */
      --text-caption: 12px;
      --text-kicker: 11px;    /* DM Sans 500, caps, tracking .28em — ÚNICO uppercase */
      --kicker-tracking: .28em;

      /* ── Espaciado · base 4 ─────────────────────────────────── */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 24px;   /* padding interno de card */
      --sp-6: 32px;
      --sp-7: 48px;   /* separación entre secciones */
      --sp-8: 64px;

      /* ── Radios · 3 pasos + píldora ─────────────────────────── */
      --r-sm: 8px;
      --r-card: 14px;
      --r-surface: 20px;
      --r-pill: 999px;

      /* ── Elevación · claro = sombra cálida ──────────────────── */
      --shadow-1: 0 2px 10px rgba(33, 45, 55, .10);   /* card en reposo */
      --shadow-2: 0 4px 24px rgba(33, 45, 55, .15);   /* hover / sheet */
      --shadow-3: 0 8px 40px rgba(33, 45, 55, .22);   /* flotante: mapa, modal */

      /* ── Elevación · oscuro = luz ───────────────────────────── */
      --glow-edge: inset 0 1px 0 rgba(245, 237, 224, .10); /* borde iluminado */
      --glow-vela: 0 0 24px rgba(155, 32, 53, .22);        /* interactivo */
      --shadow-dark: 0 12px 40px rgba(0, 0, 0, .5);        /* flotante oscuro */

      /* ── Motion · una curva, tres tiempos ───────────────────── */
      --ease: cubic-bezier(.22, 1, .36, 1);          /* curva de la casa */
      --ease-copa: cubic-bezier(.34, 1.56, .64, 1);  /* elástica: SOLO copitas */
      --t-feedback: 150ms;   /* tap, hover, press */
      --t-local: 250ms;      /* tabs, filtros, tooltips */
      --t-ritual: 600ms;     /* entrar/salir de cata, abrir ficha */
      --stagger: 60ms;       /* cascada de barras */
    }
    html,body{height:100%}
    body{
      font-family:'DM Sans',sans-serif;font-weight:300;
      background:#FAF5EE;
      color:var(--ink);overscroll-behavior:none;
      min-height:100vh;
    }
    .app{
      display:flex;flex-direction:column;min-height:100vh;
      max-width:430px;margin:0 auto;
      background:transparent;
      position:relative;
      overflow-x:hidden; /* evita desbordamiento horizontal en móvil */
    }
    #loading.hidden{opacity:0;pointer-events:none}
    .hidden{display:none!important}

    /* ── ANIMATIONS ── */
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    @keyframes stepEnterNext{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
    @keyframes stepEnterBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
    @keyframes revealGlow{from{opacity:0;transform:translateX(-50%) scale(.5)}to{opacity:1;transform:translateX(-50%) scale(1)}}
    @keyframes revealPop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}

    /* ══════════════════════════════
       HEADER
    ══════════════════════════════ */
    .header{
      background:var(--madera-dk);
      padding:56px 22px 24px;
      position:relative;overflow:hidden;
    }
    .header::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse at 80% 0%, rgba(196,120,90,.2) 0%, transparent 60%),
                 radial-gradient(ellipse at 0% 100%, rgba(207,172,89,.1) 0%, transparent 50%);
      pointer-events:none;
    }
    .header::after{
      content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(207,172,89,.35),transparent);
    }
    .eyebrow{
      font-size:10px;letter-spacing:.45em;text-transform:uppercase;
      color:rgba(207,172,89,.75);margin-bottom:8px;font-weight:500;
    }
    .header h1{
      font-family:'Cormorant Garamond',serif;
      font-size:52px;font-weight:700;color:var(--ink-dark);
      line-height:.95;letter-spacing:-.02em;
    }
    .header h1 span{
      color:var(--piedra);
      font-style:italic;font-weight:300;
    }
    .header p{margin-top:12px;font-size:var(--text-caption);color:rgba(245,237,224,.55);line-height:1.65;font-weight:300;letter-spacing:.02em}

    /* ══════════════════════════════
       MAP
    ══════════════════════════════ */
    .map-section{
      background:var(--madera-dk);
      padding:16px 16px 20px;
      position:relative;
      box-shadow:0 4px 24px rgba(40,20,8,.18);
    }
    .map-section::before{
      content:none; /* eyebrow ya está en el HTML, evita duplicado */
    }
    .map-section h2{
      font-family:'Cormorant Garamond',serif;
      font-size:18px;font-weight:600;color:var(--ink-dark);
      margin-bottom:12px;margin-top:2px;
    }
    .map-canvas{
      background:#DED0BA;
      border-radius:var(--r-surface);position:relative;height:296px;overflow:hidden;
      touch-action:none;-webkit-user-select:none;user-select:none;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.5),
                 0 6px 32px rgba(60,35,10,.2),
                 0 2px 0 rgba(80,55,30,.12);
      border:1px solid rgba(80,55,30,.18);
      cursor:default;
    }
    .map-canvas.zoomed{cursor:grab}
    .map-canvas.zoomed:active{cursor:grabbing}
    .map-axis-h{position:absolute;top:50%;left:6%;right:6%;height:.5px;background:rgba(80,55,35,.18);pointer-events:none}
    .map-axis-v{position:absolute;left:50%;top:10%;bottom:8%;width:.5px;background:rgba(80,55,35,.18);pointer-events:none}
    .map-label{
      position:absolute;font-size:9px;letter-spacing:.3em;
      text-transform:uppercase;color:rgba(80,60,40,.6);
      pointer-events:none;font-family:'DM Sans',sans-serif;font-weight:500;
    }
    .map-watermark{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      font-size:9px;letter-spacing:.4em;text-transform:uppercase;
      color:rgba(100,75,50,.06);font-weight:700;pointer-events:none;
    }
    .wine-pin{
      position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:2;
      opacity:1;
      transition:transform .25s cubic-bezier(.34,1.56,.64,1), filter .2s;
    }
    /* Área táctil extendida invisible — mínimo 44×44px para iOS/Android */
    .wine-pin::before{
      content:'';
      position:absolute;
      top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:44px; height:44px;
      min-width:44px; min-height:44px;
      border-radius:50%;
      /* Transparente — solo amplía el área tocable */
    }
    .wine-pin:active{z-index:10}
    .wine-pin:active .copita{
      transform:scale(.9);
      filter:brightness(1.3) drop-shadow(0 2px 4px rgba(0,0,0,.3));
    }
    /* Copa seleccionada */
    .wine-pin.pin-selected{
      transform:translate(-50%,-50%) scale(1.28) !important;
      filter:drop-shadow(0 0 6px rgba(196,160,90,.5)) drop-shadow(0 4px 10px rgba(0,0,0,.5));
      z-index:20 !important;
    }
    .copita{display:block;transition:transform .2s var(--ease-copa),filter .2s}
    .wine-pin:hover:not(.pin-selected):not(.pin-dimmed) .copita{transform:scale(1.12);filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
    /* Copas de otro tipo al filtrar */
    .wine-pin.pin-dimmed{opacity:.2;pointer-events:none;transition:opacity .25s}
    /* Copas no elegidas mientras hay una copita seleccionada (handoff Paso 8) */
    .wine-pin.pin-unselected-dim{opacity:.45;transition:opacity .25s}

    /* Tooltip mejorado */
    .pin-tooltip{
      position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);
      background:var(--dark);border-radius:var(--r-card);padding:9px 14px;
      white-space:nowrap;pointer-events:none;opacity:0;
      transition:opacity .2s, transform .2s;transform-origin:bottom center;
      z-index:50;border:1px solid rgba(196,160,90,.25);
      box-shadow:var(--shadow-dark);
    }
    .pin-tooltip.show{opacity:1}
    .pin-tooltip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--dark)}
    .pin-tooltip.below{bottom:auto;top:calc(100% + 12px)}
    .pin-tooltip.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--dark)}
    .pt-name{font-size:var(--text-caption);font-weight:500;color:var(--ink-dark);line-height:1.2}
    .pt-price{font-size:var(--text-kicker);color:var(--madera);margin-top:2px;font-weight:400;letter-spacing:.03em}

    /* Mini-preview card sobre el mapa */
    .map-preview{
      position:absolute;z-index:100;pointer-events:none;
      opacity:0;transition:opacity .2s, transform .2s;
      transform:translateY(6px);
      min-width:180px;max-width:220px;
    }
    .map-preview.show{opacity:1;transform:translateY(0)}
    .map-preview-inner{
      background:var(--dark);border:1px solid rgba(196,160,90,.3);
      border-radius:var(--r-card);padding:13px 15px;
      box-shadow:var(--shadow-dark);
    }
    .map-preview-inner::before{
      content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);
      width:12px;height:6px;
      background:var(--dark);clip-path:polygon(0 0,100% 0,50% 100%);
      border-left:1px solid rgba(196,160,90,.3);
      border-right:1px solid rgba(196,160,90,.3);
    }
    .map-preview.above .map-preview-inner::before{
      bottom:auto;top:-6px;
      clip-path:polygon(50% 0,0 100%,100% 100%);
      border-top:1px solid rgba(196,160,90,.3);
      border-left:none;border-right:none;
    }
    .mpv-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .mpv-name{font-size:var(--text-caption);font-weight:500;color:var(--ink-dark);line-height:1.25}
    .mpv-bodega{font-size:10px;color:var(--ink-3);margin-top:1px;font-weight:300}
    .mpv-divider{height:.5px;background:rgba(196,160,90,.15);margin:8px 0}
    .mpv-row{display:flex;justify-content:space-between;align-items:center}
    .mpv-tipo{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:400}
    .mpv-price{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--ink-dark)}
    .mpv-aromas{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
    .mpv-aroma{
      font-size:10px;color:var(--ink-dark-2);
      background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
      border-radius:var(--r-card);padding:2px 8px;
    }

    .legend-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
    .legend-pill{
      display:flex;align-items:center;gap:5px;
      background:var(--dark-3);border:1px solid rgba(196,160,90,.12);
      border-radius:var(--r-surface);padding:5px 13px;font-size:var(--text-kicker);color:var(--ink-dark-2);
      transition:all .2s;cursor:pointer;user-select:none;
    }
    .legend-pill:hover{border-color:rgba(196,160,90,.3);color:var(--ink-dark)}
    .legend-pill.active{
      background:rgba(196,160,90,.15);
      border-color:rgba(196,160,90,.5);
      color:var(--ink-dark);font-weight:500;
    }
    .legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

    /* ══════════════════════════════
       TABS
    ══════════════════════════════ */
    .tab-bar{
      display:flex;
      background:rgba(250,245,238,.96);
      border-bottom:1px solid rgba(139,106,58,.16);
      position:sticky;top:0;z-index:100;overflow-x:auto;
      box-shadow:var(--shadow-1);
    }
    .tab-bar::-webkit-scrollbar{display:none}
    .tab-btn{
      flex:1;min-width:60px;padding:14px 6px;text-align:center;
      font-size:var(--text-kicker);font-weight:400;letter-spacing:.05em;
      color:var(--ink-3);border-bottom:2px solid transparent;
      cursor:pointer;transition:all .2s;
      background:none;border-top:none;border-left:none;border-right:none;
      font-family:'DM Sans',sans-serif;white-space:nowrap;text-transform:uppercase;
    }
    .tab-btn.active{color:var(--madera-dk);border-bottom-color:var(--accent);font-weight:600}
    .tab-content{display:none;padding:20px 16px;padding-bottom:48px;
      overflow:hidden;width:100%;box-sizing:border-box;}
    .tab-content.active{display:block;animation:fadeUp .32s cubic-bezier(.22,1,.36,1)}
    .section-title{
      font-family:'Cormorant Garamond',serif;
      font-size:var(--text-name);font-weight:600;color:var(--madera-dk);
      margin-bottom:14px;margin-top:2px;
    }

    /* ══════════════════════════════
       WINE LIST
    ══════════════════════════════ */
    .carta-search{
      width:100%;background:rgba(255,255,255,.7);border:1px solid rgba(80,55,30,.14);
      border-radius:var(--r-card);padding:11px 14px 11px 38px;font-size:var(--text-data);color:var(--ink);
      font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;
      margin-bottom:14px;
    }
    .carta-search:focus{border-color:var(--accent);background:rgba(255,255,255,.9)}
    .carta-search-wrap{position:relative}
    .carta-search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
    .wine-card{
      background:#FFFFFF;
      border:1px solid rgba(139,106,58,.15);
      border-radius:var(--r-card);padding:13px 15px;margin-bottom:8px;
      display:flex;align-items:flex-start;gap:12px;cursor:pointer;
      transition:border-color .2s,box-shadow .2s;
      position:relative;box-shadow:var(--shadow-1);
      width:100%;box-sizing:border-box;overflow:hidden;
      min-width:0;
      /* Sin backdrop-filter — causa bug GPU en Android */
    }
    .wine-card:hover{box-shadow:var(--shadow-2);border-color:rgba(139,106,58,.3);background:#fff}
    .wine-card:active{opacity:.9}
    .wine-card.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(122,20,40,.1)}
    .wc-thumb{
      width:34px;height:34px;flex-shrink:0;margin-top:1px;
      border-radius:var(--r-sm);object-fit:contain;
      background:rgba(240,228,204,.55);border:1px solid var(--line);
    }
    .wc-info{flex:1;min-width:0;overflow:hidden}
    .wc-name{font-size:var(--text-data);font-weight:500;color:var(--ink);letter-spacing:.01em;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .wc-sub{font-size:var(--text-kicker);color:var(--ink-2);margin-top:2px;font-weight:300;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .wc-price{flex-shrink:0;text-align:right}
    .wc-price-num{
      font-family:'Cormorant Garamond',serif;
      font-size:var(--text-name);font-weight:600;color:var(--ink);white-space:nowrap;line-height:1.15;
    }
    .wc-price-cap{font-size:10px;color:var(--ink-3);white-space:nowrap;margin-top:1px}
    .wc-star{position:absolute;top:11px;right:13px;font-size:9px;color:var(--accent);font-weight:600;letter-spacing:.05em}

    /* ══════════════════════════════
       FICHA TÉCNICA
    ══════════════════════════════ */
    .ficha-card{
      background:rgba(255,255,255,.88);
      border:1px solid rgba(139,106,58,.14);
      border-radius:var(--r-card);padding:18px;margin-bottom:12px;
      box-shadow:var(--shadow-1);
      animation:fadeUp .3s var(--ease);
    }
    .fi-label{
      font-size:var(--text-kicker);letter-spacing:.01em;
      color:var(--ink-3);margin-bottom:4px;font-weight:600;
    }
    .ficha-placeholder{text-align:center;padding:56px 0;color:var(--ink-3);font-size:var(--text-data);line-height:1.8}

    /* Hero editorial */
    .ficha-hero{
      background:var(--bg2);border-radius:var(--r-surface);
      padding:20px 20px 22px;margin-bottom:16px;position:relative;overflow:visible;
    }
    .ficha-hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    .ficha-name{
      font-family:var(--font-serif);
      font-size:30px;font-weight:700;color:var(--ink);line-height:1.08;max-width:72%;
    }
    .ficha-winery{font-size:var(--text-kicker);color:var(--ink-3);margin-top:5px;font-weight:300;letter-spacing:.04em;text-transform:uppercase}
    .ficha-hero-price{font-family:var(--font-serif);font-size:28px;font-weight:600;color:var(--accent);margin-top:14px;line-height:1}
    .ficha-hero-price-cap{font-size:11px;font-family:var(--font-sans);font-weight:400;color:var(--ink-3);margin-left:6px}
    .ficha-botella{
      position:absolute;right:-6px;bottom:-24px;height:200px;max-width:44%;object-fit:contain;
      mix-blend-mode:multiply;
      filter:drop-shadow(-10px 14px 18px rgba(60,35,10,.3)) saturate(1.05);
      transform:rotate(4deg);
      pointer-events:none;
    }

    /* Nota de cata — pull quote */
    .ficha-quote-kicker{
      font-size:var(--text-kicker);letter-spacing:var(--kicker-tracking);text-transform:uppercase;
      color:var(--madera-dk);text-align:center;margin-bottom:8px;font-weight:500;
    }
    .ficha-quote{
      font-family:var(--font-serif);font-style:italic;font-size:var(--text-name);color:var(--ink);
      text-align:center;line-height:1.5;margin-bottom:18px;padding:0 6px;
    }

    /* Datos técnicos — lista contra-etiqueta */
    .ficha-data-list{margin-bottom:14px}
    .ficha-data-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
    .ficha-data-row:last-child{border-bottom:none}
    .ficha-data-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;flex-shrink:0}
    .ficha-data-value{font-size:var(--text-data);color:var(--ink);font-weight:500;text-align:right}

    /* Maridaje */
    .maridaje-section{margin-bottom:14px}
    .maridaje-title{
      font-size:var(--text-kicker);letter-spacing:.01em;
      color:var(--ink-3);margin-bottom:9px;font-weight:600;
    }
    .maridaje-pills{display:flex;flex-wrap:wrap;gap:6px}
    .maridaje-pill{
      display:flex;align-items:center;gap:5px;
      background:rgba(240,228,204,.5);border:1px solid rgba(139,106,58,.15);
      border-radius:var(--r-surface);padding:5px 12px;font-size:var(--text-kicker);color:var(--ink);font-weight:400;
    }
    .maridaje-icon{font-size:var(--text-data)}

    /* Perfil de sabor */
    .perfil-section{margin-bottom:14px}
    .perfil-title{
      font-size:var(--text-kicker);letter-spacing:.01em;
      color:var(--ink-3);margin-bottom:10px;font-weight:600;
    }
    .perfil-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
    .perfil-label{font-size:var(--text-kicker);color:var(--ink-3);width:56px;flex-shrink:0;font-weight:300}
    .perfil-bar-bg{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
    .perfil-bar-fill{height:100%;border-radius:2px;background:var(--accent-grad);width:0;transition:width .6s var(--ease)}
    .perfil-val{font-size:10px;color:var(--ink-3);width:16px;text-align:right;flex-shrink:0}

    /* Bodega info */
    .bodega-section{
      background:var(--dark);border-radius:var(--r-surface);padding:16px 17px;margin-bottom:0;
      border:1px solid rgba(207,172,89,.15);
    }
    .bodega-label{font-size:var(--text-kicker);letter-spacing:.01em;color:var(--madera);margin-bottom:6px;font-weight:600}
    .bodega-text{font-family:var(--font-serif);font-style:italic;font-size:17px;color:rgba(245,237,224,.85);line-height:1.6;font-weight:400}

    .charc-price{
      font-family:'Cormorant Garamond',serif;
      font-size:var(--text-voice);font-weight:600;color:var(--ink);white-space:nowrap;
    }

    /* ══════════════════════════════
       SOMMELIER
    ══════════════════════════════ */
    .somm-intro{
      background:var(--madera-dk);border-radius:var(--r-surface);padding:24px 20px;margin-bottom:16px;
      text-align:center;border:1px solid rgba(207,172,89,.18);
      position:relative;overflow:hidden;
      box-shadow:0 4px 24px rgba(40,20,8,.2);
    }
    .somm-intro::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse at 50% 0%,rgba(155,32,48,.15) 0%,transparent 70%);
      pointer-events:none;
    }
    .somm-intro h3{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--ink-dark);margin-bottom:8px;font-style:italic}
    .somm-intro p{font-size:var(--text-data);color:var(--ink-dark-2);line-height:1.6;font-weight:300}
    /* Botones · 3 niveles, radio píldora (handoff Paso 6) */
    .btn-primario,.btn-secundario,.btn-terciario{
      border-radius:var(--r-pill);padding:15px;width:100%;
      font-family:var(--font-sans);font-size:12px;font-weight:500;
      letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:8px;
      border:none;transition:transform var(--t-feedback) var(--ease);
    }
    .btn-primario:active,.btn-secundario:active,.btn-terciario:active{transform:scale(.98)}
    .btn-primario{background:var(--accent-grad);color:#fff;box-shadow:0 4px 20px rgba(155,32,53,.3)}
    .btn-secundario{background:var(--madera-dk);color:var(--ink-dark)}
    .btn-terciario{background:none;color:var(--ink-2);border:1px solid var(--line-strong)}

    .somm-start-btn{margin-top:16px}
    .somm-step{display:none}
    .somm-step.active{display:block;animation:fadeUp .25s var(--ease)}
    .somm-question{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--ink);margin-bottom:6px;line-height:1.25}
    .somm-sub{font-size:var(--text-data);color:var(--ink-3);margin-bottom:16px;font-weight:300}
    .somm-options{display:flex;flex-direction:column;gap:9px}
    .somm-opt{
      background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
      padding:15px 16px;cursor:pointer;
      transition:all .2s;display:flex;align-items:center;gap:13px;
      box-shadow:var(--shadow-1);
    }
    .somm-opt:hover{border-color:rgba(139,106,58,.25);box-shadow:var(--shadow-2)}
    .somm-opt:active{background:rgba(240,228,204,.6);border-color:var(--madera)}
    .somm-opt.selected{background:rgba(240,228,204,.7);border-color:var(--madera);box-shadow:0 0 0 3px rgba(207,172,89,.18)}
    .somm-opt.selected .somm-opt-icon{transform:scale(1.15)}
    .somm-options.locked .somm-opt:not(.selected){opacity:.45}
    .somm-opt-icon{font-size:22px;flex-shrink:0;transition:transform .2s var(--ease-copa)}
    .somm-opt-text{font-size:14px;font-weight:500;color:var(--ink)}
    .somm-opt-sub{font-size:var(--text-caption);color:var(--ink-3);margin-top:2px;font-weight:300}
    .somm-progress{display:flex;gap:4px;margin-bottom:20px}
    .somm-dot{height:2px;flex:1;border-radius:2px;background:var(--line);transition:background .3s}
    .somm-dot.done{background:var(--ink)}
    .somm-dot.active{background:var(--accent)}
    .somm-thinking{text-align:center;padding:56px 0;animation:fadeUp .3s var(--ease)}
    .somm-thinking-glass{font-size:36px;animation:sommPulse 1.1s ease-in-out infinite}
    .somm-thinking-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:var(--text-name);color:var(--ink-3);margin-top:14px}
    @keyframes sommPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
    .somm-results{display:none;animation:fadeUp .3s var(--ease)}
    .somm-results h3{font-family:'Cormorant Garamond',serif;font-size:var(--text-name);color:var(--ink);margin-bottom:5px}
    .somm-results p{font-size:var(--text-data);color:var(--ink-3);margin-bottom:16px;font-weight:300}
    @keyframes revealCard{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    .somm-result-card{
      background:rgba(255,255,255,.75);
      border:1px solid rgba(80,55,30,.12);border-radius:var(--r-card);
      padding:15px;margin-bottom:10px;cursor:pointer;
      transition:border-color .2s,box-shadow .2s;box-shadow:var(--shadow-1);
      animation:revealCard .4s var(--ease) both;
    }
    .somm-result-card:hover{box-shadow:var(--shadow-2);border-color:rgba(60,40,20,.18)}
    /* El resultado #1 gana peso propio — más padding, fondo sólido y borde
       acento — en vez de las 3 opciones lucir todas igual de relevantes. */
    .somm-result-hero{
      background:var(--surface);padding:18px;
      border-color:rgba(122,20,40,.25);box-shadow:var(--shadow-2);
    }
    .somm-result-hero .src-rank{width:34px;height:34px;font-size:15px}
    .somm-result-hero .src-name{font-size:17px;font-family:'Cormorant Garamond',serif;font-weight:600}
    .src-header{display:flex;align-items:flex-start;gap:11px;margin-bottom:8px}
    .src-rank{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--text-caption);font-weight:600;color:#fff;flex-shrink:0;box-shadow:var(--shadow-1)}
    .src-name{font-size:14px;font-weight:500;color:var(--ink);line-height:1.2}
    .src-why{font-size:var(--text-caption);color:var(--ink-3);margin-top:2px;line-height:1.45;font-weight:300}
    .src-price{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--ink);margin-top:8px}
    .src-maridaje{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
    .src-pill{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-surface);padding:3px 10px;font-size:var(--text-kicker);color:var(--ink);font-weight:300}
    .somm-restart{margin-top:4px}

    /* ══════════════════════════════
       COMPRAR
    ══════════════════════════════ */
    .comprar-btn{margin-top:16px;text-decoration:none}

    /* ══════════════════════════════
       CATA OVERLAY — se abre desde el CTA de "Mis catas"
    ══════════════════════════════ */
    .cata-overlay{
      position:fixed;inset:0;z-index:600;background:var(--dark-cata);
      overflow-y:auto;animation:lightsDown var(--t-ritual) var(--ease);
    }
    .cata-overlay.hidden{display:none}
    .cata-overlay.closing{animation:lightsUp var(--t-ritual) var(--ease) forwards}
    @keyframes lightsDown{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
    @keyframes lightsUp{from{opacity:1;transform:none}to{opacity:0;transform:scale(.97)}}
    .cata-overlay-inner{max-width:430px;margin:0 auto;min-height:100%}
    .cata-overlay-header{position:sticky;top:0;z-index:10;display:flex;justify-content:flex-end;
      padding:14px 16px 0;background:var(--dark-cata)}
    .cata-overlay-close{
      width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);color:var(--ink-dark);font-size:var(--text-body);
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      font-family:'DM Sans',sans-serif;transition:background .15s;
    }
    .cata-overlay-close:hover{background:rgba(255,255,255,.15)}

    /* ══════════════════════════════
       MIS CATAS — email + CTA de catar
    ══════════════════════════════ */
    .miscatas-email-row{
      display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.7);
      border:1px solid rgba(80,55,30,.14);border-radius:var(--r-card);padding:10px 14px;margin-bottom:16px;
    }
    .miscatas-email-row svg{color:var(--ink-3);flex-shrink:0}
    .miscatas-email-row span{font-size:var(--text-data);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .miscatas-email-row button{
      margin-left:auto;background:none;border:none;color:var(--accent);font-size:var(--text-kicker);
      text-transform:uppercase;letter-spacing:.05em;cursor:pointer;font-family:'DM Sans',sans-serif;flex-shrink:0;
    }
    .cta-cata{
      display:flex;align-items:center;gap:12px;cursor:pointer;
      background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);
      color:#fff;border-radius:var(--r-card);padding:18px;margin-bottom:24px;
      box-shadow:0 6px 24px rgba(155,32,48,.32);transition:transform .15s;
    }
    .cta-cata:active{transform:scale(.98)}
    .cta-cata .icon{font-size:24px;flex-shrink:0}
    .cta-cata .txt-main{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;font-style:italic}
    .cta-cata .txt-sub{font-size:var(--text-kicker);opacity:.85;margin-top:2px;font-weight:300}
    .miscatas-divider{
      font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--ink-3);
      margin-bottom:12px;display:flex;align-items:center;gap:8px;
    }
    .miscatas-divider::after{content:'';flex:1;height:1px;background:var(--line)}

    /* ══════════════════════════════
       CATA — formulario dentro del overlay
    ══════════════════════════════ */
    .form-card{
      background:var(--surface);border:1px solid var(--line);border-radius:var(--r-surface);
      padding:20px;margin-bottom:12px;box-shadow:var(--shadow-1);
    }
    .form-card h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--ink);margin-bottom:5px;font-weight:600}
    .form-card .form-sub{font-size:var(--text-data);color:var(--ink-3);margin-bottom:20px;line-height:1.5;font-weight:300}
    .field-group{margin-bottom:20px}
    .field-label{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:11px}
    .field-label span{font-size:10px;color:var(--ink-3);font-weight:300;margin-left:4px;text-transform:none;letter-spacing:0}
    .wine-select{
      width:100%;background:rgba(255,255,255,.7);border:1px solid rgba(80,55,30,.14);
      border-radius:var(--r-card);padding:11px 14px;font-size:var(--text-data);color:var(--ink);
      font-family:'DM Sans',sans-serif;outline:none;-webkit-appearance:none;appearance:none;cursor:pointer;
      transition:border-color .2s;
    }
    .wine-select:focus{border-color:var(--accent);background:rgba(255,255,255,.9)}
    .score-display{text-align:center;margin-bottom:18px}
    .score-big{
      font-family:'Cormorant Garamond',serif;
      font-size:64px;font-weight:700;color:var(--accent);line-height:1;
      text-shadow:0 2px 8px rgba(155,32,48,.15);
    }
    .score-lbl{font-size:var(--text-data);color:var(--ink-3);margin-top:5px;min-height:18px;font-weight:300}
    .main-track-wrap{position:relative;padding-bottom:26px}
    .main-track{height:4px;background:var(--line);border-radius:2px;position:relative;cursor:pointer}
    .main-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
    .main-handle{position:absolute;top:50%;transform:translate(-50%,-50%);cursor:grab;z-index:3;transition:transform .1s}
    .main-handle:active{transform:translate(-50%,-50%) scale(1.2)}
    .main-ticks{display:flex;justify-content:space-between;margin-top:8px}
    .main-ticks span{font-size:10px;color:var(--ink-3);width:10px;text-align:center}
    .main-ticks span.hi{color:var(--accent);font-weight:600;font-size:var(--text-kicker)}
    .attr-list{display:flex;flex-direction:column;gap:18px}
    .attr-row{display:flex;align-items:center;gap:12px}
    .attr-name{font-size:var(--text-kicker);font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);width:62px;flex-shrink:0}
    .attr-slider-wrap{flex:1}
    .attr-track{height:4px;background:var(--line);border-radius:2px;position:relative;cursor:pointer}
    .attr-fill{height:100%;border-radius:2px}
    .attr-handle{position:absolute;top:50%;transform:translate(-50%,-50%);cursor:grab;z-index:3}
    .attr-handle:active{transform:translate(-50%,-50%) scale(1.15)}
    .attr-dots{display:flex;gap:5px;margin-top:6px}
    .attr-dot{width:7px;height:7px;border-radius:50%}
    .attr-val{font-family:'Cormorant Garamond',serif;font-size:var(--text-body);font-weight:600;width:28px;text-align:right;flex-shrink:0}
    .opinion-input{
      width:100%;background:rgba(255,255,255,.7);border:1px solid rgba(80,55,30,.14);border-radius:var(--r-card);
      padding:11px 14px;font-size:var(--text-data);color:var(--ink);font-family:'DM Sans',sans-serif;
      outline:none;resize:none;line-height:1.6;font-weight:300;transition:border-color .2s;
    }
    .opinion-input:focus{border-color:var(--accent);background:rgba(255,255,255,.9)}
    .submit-btn{
      width:100%;background:var(--madera-dk);color:#fff;border:none;border-radius:var(--r-card);
      padding:15px;font-size:var(--text-data);font-weight:500;cursor:pointer;
      font-family:'DM Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;
      display:flex;align-items:center;justify-content:center;gap:8px;
      transition:opacity .15s,transform .15s;margin-top:6px;
      box-shadow:0 4px 16px rgba(20,10,0,.2);
    }
    .submit-btn:active{opacity:.85;transform:scale(.99)}
    .submit-btn:disabled{opacity:.4;cursor:not-allowed}
    .form-success{
      background:var(--madera-dk);position:relative;overflow:hidden;
      border:1px solid rgba(207,172,89,.2);border-radius:var(--r-surface);
      padding:28px 20px;text-align:center;margin-bottom:12px;
    }
    .form-success .reveal-glow{
      position:absolute;top:-30%;left:50%;width:240px;height:240px;
      background:radial-gradient(circle,rgba(207,172,89,.4),transparent 70%);
      animation:revealGlow .9s var(--ease) forwards;pointer-events:none;
    }
    .form-success .reveal-score{
      position:relative;font-family:'Cormorant Garamond',serif;font-size:64px;font-weight:700;
      color:var(--accent);line-height:1;margin-bottom:2px;animation:revealPop .5s var(--ease) .1s both;
    }
    .form-success .reveal-label{
      position:relative;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--madera);margin-bottom:14px;
    }
    .form-success .success-icon{font-size:40px;margin-bottom:12px;display:block}
    .form-success h3{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--ink-dark);margin-bottom:6px}
    .form-success p{font-size:var(--text-data);color:rgba(245,237,224,.65);line-height:1.55;font-weight:300}
    .form-success button{
      margin-top:16px;background:transparent;border:1px solid var(--line-dark-strong);
      border-radius:var(--r-pill);padding:10px 22px;font-size:var(--text-caption);color:var(--ink-dark-2);
      cursor:pointer;font-family:'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;
      transition:border-color .2s;
    }

    /* ══════════════════════════════
       WHATSAPP POPUP
    ══════════════════════════════ */
    .wa-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:700;display:flex;align-items:flex-end;justify-content:center;
      border-radius:var(--r-surface) var(--r-surface) 0 0;padding:30px 22px 44px;
      width:100%;max-width:430px;animation:slideUp .3s cubic-bezier(.22,1,.36,1);
      border-top:1px solid rgba(139,106,58,.18);box-shadow:0 -8px 40px rgba(60,35,10,.18);
    }
    .wa-sheet h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--ink);margin-bottom:6px;font-weight:600}
    .wa-sheet p{font-size:var(--text-data);color:var(--ink-3);line-height:1.55;margin-bottom:20px;font-weight:300}
    .wa-phone-input{
      width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-card);
      padding:13px 15px;font-size:var(--text-body);color:var(--ink);font-family:'DM Sans',sans-serif;
      outline:none;margin-bottom:10px;letter-spacing:.02em;transition:border-color .2s;
    }
    .wa-phone-input:focus{border-color:#25D366}
    /* Verde de WhatsApp intencional — excepción de marca, no se tokeniza */
    .wa-send-btn{
      width:100%;background:#25D366;color:#fff;border:none;border-radius:var(--r-pill);
      padding:15px;font-size:12px;font-weight:500;cursor:pointer;
      font-family:var(--font-sans);display:flex;align-items:center;
      justify-content:center;gap:8px;margin-bottom:10px;
      letter-spacing:.12em;text-transform:uppercase;
      box-shadow:0 4px 16px rgba(37,211,102,.25);
      transition:transform var(--t-feedback) var(--ease);
    }
    .wa-send-btn:active{transform:scale(.98)}
    .wa-skip-btn{margin-bottom:0}
    .wa-toast{
      position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:900;
      background:var(--dark);color:var(--ink-dark);border:1px solid rgba(37,211,102,.35);
      border-radius:var(--r-pill);padding:11px 20px;font-size:12px;font-family:'DM Sans',sans-serif;
      letter-spacing:.02em;box-shadow:var(--shadow-dark);max-width:88%;text-align:center;
      animation:toastIn .25s var(--ease),toastOut .25s var(--ease) 2.5s forwards;
    }
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    @keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(10px)}}

    /* ══════════════════════════════
       FOOTER
    ══════════════════════════════ */
    .footer{
      background:var(--dark);padding:24px 20px;text-align:center;
      border-top:1px solid rgba(196,160,90,.2);
      box-shadow:0 -4px 24px rgba(20,10,0,.15);
    }
    .footer p{font-size:var(--text-kicker);color:var(--ink-3);line-height:1.9;font-weight:300;letter-spacing:.02em}
    .footer strong{color:var(--madera);font-weight:400}

    /* ══════════════════════════════
       LOADING
    ══════════════════════════════ */
    #loading{
      position:fixed;inset:0;
      background:#FAF5EE;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      z-index:999;transition:opacity .5s;
    }
    #loading::before{
      content:'';position:absolute;inset:0;
      background:radial-gradient(ellipse at 50% 40%,rgba(155,32,48,.15) 0%,transparent 65%);
    }
    #loading h2{
      font-family:'Cormorant Garamond',serif;
      font-size:var(--text-display);font-weight:700;color:var(--madera-dk);letter-spacing:-.02em;
    }
    #loading h2 span{color:var(--accent);font-style:italic;font-weight:300}
    #loading h2{animation:loadPulse 1.8s ease-in-out infinite}
    #loading p{font-size:var(--text-kicker);color:var(--ink-3);margin-top:14px;letter-spacing:.2em;text-transform:uppercase}
    .loading-bar{
      width:120px;height:2px;border-radius:2px;overflow:hidden;
      background:rgba(139,106,58,.15);margin-top:20px;position:relative;
    }
    .loading-bar::after{
      content:'';position:absolute;top:0;bottom:0;left:-40%;width:40%;
      background:linear-gradient(90deg,transparent,var(--accent),transparent);
      animation:loadSweep 1.3s ease-in-out infinite;
    }
    @keyframes loadSweep{0%{left:-40%}100%{left:100%}}
    @keyframes loadPulse{0%,100%{opacity:1}50%{opacity:.55}}

    /* ── ZOOM ── */
    #mapInner{
      position:absolute;inset:0;
      transform-origin:50% 50%;
      transition:transform .25s cubic-bezier(.22,1,.36,1);
      will-change:transform;
    }
    .zoom-controls{
      position:absolute;top:10px;right:10px;z-index:200;
      display:flex;flex-direction:column;gap:4px;
    }
    .zoom-btn{
      width:28px;height:28px;border-radius:var(--r-sm);
      background:rgba(28,25,23,.75);border:1px solid rgba(196,160,90,.25);
      color:var(--ink-dark);font-size:16px;font-weight:300;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:background .15s,border-color .15s;
      font-family:'DM Sans',sans-serif;line-height:1;
    }
    .zoom-btn:hover{background:rgba(28,25,23,.9);border-color:rgba(196,160,90,.5)}
    .zoom-btn:active{transform:scale(.92)}
    .zoom-reset{font-size:var(--text-caption)}
    .zoom-hint{
      position:absolute;bottom:8px;right:48px;
      font-size:9px;letter-spacing:.12em;text-transform:uppercase;
      color:rgba(80,60,40,.35);pointer-events:none;white-space:nowrap;
      transition:opacity .5s;
    }
    .zoom-hint.hide{opacity:0}

    /* Pin label — aparece solo con zoom alto, tamaño fijo en pantalla */
    .pin-zoom-label{
      position:absolute;top:calc(100% + 1px);left:50%;transform:translateX(-50%);
      font-size:8px;font-weight:500;color:rgba(255,255,255,.9);
      background:rgba(20,15,10,.75);border-radius:var(--r-sm);padding:1px 5px;
      white-space:nowrap;pointer-events:none;letter-spacing:.01em;
      opacity:0;transition:opacity .25s;
      max-width:70px;overflow:hidden;text-overflow:ellipsis;
    }
    .pin-label-visible .pin-zoom-label{opacity:1}

    /* ── ZOOM ── */
    .axis-desc{
      margin-top:10px;display:flex;flex-direction:column;gap:3px;
    }
    .axis-desc span{font-size:var(--text-kicker);color:rgba(220,210,195,.8);font-weight:300}
    .axis-desc strong{color:var(--ink-dark);font-weight:500}
    .axis-map-hint{font-size:var(--text-kicker);color:var(--ink-3);margin-top:6px;font-weight:300}

    /* ══════════════════════════════════════════════
       RESPONSIVE — tablet y desktop
       Mobile (<768px) queda exactamente igual que antes.
       ══════════════════════════════════════════════ */

    /* ── TABLET (768–1099px): columna única más ancha + grid de 2 en la carta ── */
    @media (min-width:768px){
      .app{max-width:760px}
      .tab-content{padding:28px 24px 56px}
      #wineList{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:start}
      #wineList .wine-card{margin-bottom:0}
      /* Wizards/formularios no ganan nada estirándose al ancho completo —
         mismo criterio que ya usa .cata-overlay-inner. */
      #sommContent,#misCatasContent{max-width:520px;margin-left:auto;margin-right:auto}
      #fichaContent{max-width:640px;margin-left:auto;margin-right:auto}
    }

    /* ── DESKTOP (≥1100px): sidebar fijo a todo el alto + contenido a lo ancho ──
       App-shell real en vez de tarjeta centrada: el sidebar queda pegado al
       borde izquierdo y ocupa el 100% de la altura de la ventana; el
       contenido usa todo el resto del ancho de la pantalla (nada de
       max-width angosto dejando márgenes vacíos a los costados). */
    @media (min-width:1100px){
      .app{
        max-width:none;
        display:flex;flex-direction:column;
        padding-left:440px; /* deja lugar al sidebar fijo */
        min-height:100vh;
      }
      /* .app-main crece para empujar el footer al piso — si no, con poco
         contenido quedaba un hueco vacío debajo del footer mientras el
         sidebar (fijo a 100vh) seguía oscuro hasta abajo. */
      .app-main{flex:1 0 auto}
      .app-sidebar{
        position:fixed;left:0;top:0;bottom:0;width:440px;
        display:flex;flex-direction:column;
        overflow-y:auto;
        box-shadow:6px 0 24px rgba(20,10,0,.12);
      }
      /* 56px de padding-top era para dejar aire bajo el status bar del
         celular — en un sidebar de escritorio es espacio de más. */
      .app-sidebar .header{padding-top:32px}
      .app-main{
        max-width:1500px;padding:40px 48px 0;
      }
      .footer{max-width:1500px;padding:24px 48px;margin-top:24px}

      /* El mapa gana alto (más presencia que el tamaño mobile de 296px) pero
         se achica solo si el viewport es más bajo — antes con height fijo
         de 460px, en una laptop de 720-800px de alto el sidebar completo
         (header+mapa+nav) no entraba y quedaba con scroll interno, tapando
         "Mis catas" del nav. min-height:0 es necesario para que un item
         flex pueda encogerse por debajo de su contenido en un flex column
         anidado — sin eso, max-height no alcanza a frenar el desborde. */
      .map-section{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
      .map-canvas{flex:1 1 auto;height:auto;min-height:200px;max-height:460px}

      /* Nav vertical con presencia real de botón (antes eran links sueltos
         con un borde fino, se leían como un menú desplegable perdido).
         flex:0 0 auto — a diferencia del mapa, el nav nunca se comprime,
         siempre se ven las 4 opciones completas. */
      .tab-bar{
        flex-direction:column;position:static;box-shadow:none;
        border-bottom:none;overflow:visible;
        padding:14px;gap:3px;background:var(--dark);flex:0 0 auto;
      }
      .tab-btn{
        text-align:left;padding:13px 16px;border-radius:var(--r-card);
        border:none;color:var(--ink-dark-3);
        transition:background .15s,color .15s;
      }
      .tab-btn:hover{background:rgba(255,255,255,.06)}
      .tab-btn.active{
        background:rgba(155,32,53,.22);color:var(--ink-dark);font-weight:600;
      }

      /* auto-fill en vez de un número fijo de columnas — se adapta solo al
         ancho real del panel principal, hasta 3 columnas en monitores anchos. */
      #wineList{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
    }
</style>
</head>

<script>
const _rootStyle=getComputedStyle(document.documentElement);
let _copitaUid=0;
// SVG de marca (handoff Paso 7). state: 'empty'|'filled'|'selected' controla
// el nivel de líquido; selected agrega el glow/escala de "copita elegida".
function copitaSVG(color,{size=22,state='filled',selected=false}={}){
  const fillY = state==='empty'?36:state==='selected'?8:14;
  const h = Math.round(size*60/44);
  const clipId = 'copaClip-'+(_copitaUid++);
  return `<svg class="copita" viewBox="0 0 44 60" width="${size}" height="${h}" fill="none" style="flex-shrink:0${selected?';transform:scale(1.35);filter:drop-shadow(0 0 8px rgba(207,172,89,.65))':''}">
    <defs><clipPath id="${clipId}"><path d="M10 4 H34 V20 C34 30 28.5 36 22 36 C15.5 36 10 30 10 20 Z"/></clipPath></defs>
    <g clip-path="url(#${clipId})">
      <rect x="10" y="4" width="24" height="34" fill="${color}" opacity=".9" style="transition:transform .5s var(--ease-copa);transform:translateY(${fillY}px)"/>
    </g>
    <path d="M10 4 H34 V20 C34 30 28.5 36 22 36 C15.5 36 10 30 10 20 Z" stroke="${selected?'var(--madera)':'var(--madera-dk)'}" stroke-width="2" stroke-linejoin="round"/>
    <path d="M22 36 V50" stroke="var(--madera-dk)" stroke-width="2" stroke-linecap="round"/>
    <path d="M13 52 H31" stroke="var(--madera-dk)" stroke-width="2" stroke-linecap="round"/>
  </svg>`;
}
const TYPE_COLOR={
  Tinto:   _rootStyle.getPropertyValue('--tinto').trim(),
  Blanco:  _rootStyle.getPropertyValue('--blanco').trim(),
  Rosado:  _rootStyle.getPropertyValue('--rosado').trim(),
  Naranja: _rootStyle.getPropertyValue('--naranja').trim(),
};
const TYPE_LABEL={Tinto:"Tinto",Blanco:"Blanco",Rosado:"Rosado",Naranja:"Naranjo"};
function esc(s){ return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function precioBottella(p){
  // Devuelve el número crudo del precio botella
  if(!p) return 0;
  const clean = p.toString().replace(/\$/g,'').trim();
  const n = parseFloat(clean.replace(/,/g,''));
  return isNaN(n) ? 0 : n;
}
function fmtPrecio(p){
  // Precio copa con multiplicador por rango de botella:
  // $10k–$13.999 → ×1.70 | $14k–$17.999 → ×1.60 | $18k–$29.999 → ×1.50 | $30k+ → ×1.25
  const botella = precioBottella(p);
  if(!botella) return p;
  let factor = 1.50; // default
  if(botella < 14000)      factor = 1.70;
  else if(botella < 18000) factor = 1.60;
  else if(botella < 30000) factor = 1.50;
  else                     factor = 1.25;
  const copa = Math.round(((botella / 6) * factor) / 500) * 500;
  return '$' + copa.toLocaleString('es-AR');
}
const MARIDAJE_ICON={"carnes rojas":"🥩","quesos duros":"🧀","quesos blandos":"🧀","jamón crudo":"🍖","tabla":"🪵","fiambres":"🥓","salmón":"🐟","mortadela":"🥩","aceitunas":"🫒","panera":"🍞","salame":"🥩"};

let wines=[], selectedId=null;
let favoritos=new Set(); // nombres de vinos mejor puntuados por clientes reales
let wineRatings=new Map(); // nombre del vino → {puntuacion, count} — para el boost del sommelier
let sommHighlightIds=null; // Set de ids resaltados en el mapa desde "Ver estos 3 en el mapa"

function fetchFavoritos(){
  fetch('/api/stats').then(r=>r.json()).then(d=>{
    const resumen = (d && d.resumen) || [];
    wineRatings = new Map(resumen.map(r => [r.vino, {puntuacion:r.puntuacion, count:r.count}]));
    favoritos = new Set(
      resumen.filter(r => r.count>=3 && r.puntuacion>=85)
             .sort((a,b) => b.puntuacion-a.puntuacion)
             .slice(0,3)
             .map(r => r.vino)
    );
    if(wines.length){ renderWineList(); if(selectedId) renderFicha(wines.find(w=>w.id===selectedId)); }
  }).catch(()=>{});
}

// ── Caché del cliente (1 minuto — alineado con el Cache-Control de /api/obtener-vinos) ──
const CACHE_KEY='125cc_wines_v1';
const CACHE_TTL=60*1000;
function getCachedWines(){
  try{const raw=localStorage.getItem(CACHE_KEY);if(!raw)return null;const{data,ts}=JSON.parse(raw);if(Date.now()-ts>CACHE_TTL)return null;return data;}catch(e){return null;}
}
function setCachedWines(data){
  try{localStorage.setItem(CACHE_KEY,JSON.stringify({data,ts:Date.now()}));}catch(e){}
}

function initApp(config, apiWines){
  if(apiWines && apiWines.length>0){ wines=apiWines; setCachedWines(apiWines); }
  document.getElementById('bar-eyebrow').textContent=config.bar.nombre;
  document.getElementById('titulo').innerHTML=config.bar.subtitulo
    ?`${config.bar.subtitulo.replace('cc','<span>cc</span>')}`
    :config.bar.nombre;
  document.getElementById('descripcion').textContent=config.bar.descripcion;
  document.getElementById('mapWatermark').textContent=`${config.bar.nombre} · ${config.bar.subtitulo||''}`;
  const parts = [];
  if(config.bar.instagram){
    const handle = config.bar.instagram.replace('@','');
    parts.push(`<a href="https://instagram.com/${handle}" target="_blank" rel="noopener"
      style="color:var(--madera);text-decoration:none;font-weight:400">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>${config.bar.instagram}</a>`);
  }
  if(config.bar.direccion) parts.push(`<strong>${config.bar.direccion}</strong>`);
  document.getElementById('footerInfo').innerHTML = parts.join(' &nbsp;·&nbsp; ');
  buildMap(); renderWineList();  initSommelier();
  // Pill "Todos" activa por defecto
  document.getElementById('pill-all')?.classList.add('active');
  // Deep link: si la URL trae #vino=ID, abrir directo esa ficha
  const hashMatch = location.hash.match(/vino=(\d+)/);
  if(hashMatch){
    const linked = wines.find(x => x.id === parseInt(hashMatch[1]));
    if(linked) selectWineAndShowFicha(linked.id);
  }
  setTimeout(()=>{
    const l=document.getElementById('loading');
    l.classList.add('hidden');
    setTimeout(()=>{l.style.display='none';},500);
    // Vacío en vez de 'flex' fijo: así el media query de desktop puede pisar
    // el display de .app a 'grid' — un inline style siempre gana sobre
    // cualquier regla del stylesheet, sin importar el breakpoint.
    document.getElementById('app').style.display='';
  },200);
}

fetchFavoritos();

fetch('./vinos.json').then(r=>r.json()).then(config=>{
    const cached=getCachedWines();
    if(cached && cached.length>0){
      // Mostrar inmediato desde caché
      wines=cached;
      initApp(config, null);
      // Actualizar en background
      fetch('/api/obtener-vinos').then(r=>r.json()).then(d=>{
        if(d && d.vinos && d.vinos.length>0){setCachedWines(d.vinos);wines=d.vinos;buildMap();renderWineList();}
      }).catch(()=>{});
    } else {
      // Primera visita — esperar la API
      fetch('/api/obtener-vinos').then(r=>r.json()).catch(()=>null).then(d=>{
        const apiWines=(d && d.vinos && d.vinos.length>0)?d.vinos:config.vinos;
        wines=apiWines;
        initApp(config, apiWines);
      });
    }
  })
  .catch(()=>{
    document.getElementById('loading').innerHTML=`
      <p style="color:#f87171;font-size:14px;padding:20px;text-align:center">Error cargando el menú.<br>Verificá tu conexión.</p>
      <button onclick="location.reload()" style="background:var(--accent);color:#fff;border:none;border-radius:var(--r-card);
        padding:12px 28px;font-size:var(--text-data);font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;
        letter-spacing:.06em;text-transform:uppercase">Reintentar</button>`;
  });

/* ── MAP ── */
let pinElements  = {}; // wine id → DOM element
let pinPositions = {}; // wine id → { w, left, top, num }

function buildMap(){
  const c = document.getElementById('mapDots');
  c.innerHTML = '';
  pinElements  = {};
  pinPositions = {};
  const old = document.getElementById('mapPreview');
  if(old) old.remove();

  wines.forEach((w) => {
    const left = 50 + w.x * 0.4, top = 50 - w.y * 0.36;
    const color = TYPE_COLOR[w.tipo] || '#888';
    const pin   = document.createElement('div');
    pin.className = 'wine-pin';
    pin.style.cssText = `left:${left}%;top:${top}%`;
    const belowClass = top < 50 ? ' below' : '';
    pin.innerHTML = `
      ${copitaSVG(color, {size:22})}
      <div class="pin-zoom-label">${esc(w.nombre.split(' ')[0])}</div>
      <div class="pin-tooltip${belowClass}" id="tip-${w.id}">
        <div class="pt-name">${esc(w.nombre)}</div>
        <div class="pt-price">${fmtPrecio(w.precio)} · ${esc(TYPE_LABEL[w.tipo]||w.tipo)}</div>
      </div>`;

    pin.addEventListener('click', e => {
      e.stopPropagation();
      if(activeFilter && w.tipo !== activeFilter) return;
      const wasSelected = selectedId === w.id;
      selectedId = wasSelected ? null : w.id;
      sommHighlightIds = null;
      updateMapSelectionClasses();
      renderWineList();
      hideMapHint();
      if(selectedId){
        renderFicha(wines.find(x => x.id === selectedId));
        showTab('ficha', document.querySelector('.tab-btn[onclick*="ficha"]'));
        try{ history.replaceState(null, '', '#vino=' + selectedId); }catch(e){}
      } else {
        try{ history.replaceState(null, '', location.pathname); }catch(e){}
      }
    });

    pinElements[w.id]  = pin;
    pinPositions[w.id] = { w, left, top };
    c.appendChild(pin);
  });

  updateMapSelectionClasses();
  updateZoomLabels();
}

function updateMapSelectionClasses(){
  wines.forEach(w => {
    const pin = pinElements[w.id];
    if(!pin) return;
    const filterDimmed = !!(activeFilter && w.tipo !== activeFilter);
    // Modo "Ver estos 3 en el mapa" (desde resultados del Sommelier): apaga
    // todo lo que no esté en la lista resaltada, ignora la selección normal.
    if(sommHighlightIds){
      pin.classList.remove('pin-selected');
      pin.classList.toggle('pin-dimmed', filterDimmed || !sommHighlightIds.has(w.id));
      pin.classList.remove('pin-unselected-dim');
      return;
    }
    pin.classList.toggle('pin-selected', w.id === selectedId);
    pin.classList.toggle('pin-dimmed', filterDimmed);
    pin.classList.toggle('pin-unselected-dim', !!selectedId && w.id !== selectedId && !filterDimmed);
  });
  if(selectedId){
    const pos = pinPositions[selectedId];
    if(pos) showMapPreview(pos.w, pos.left, pos.top);
  } else {
    const p = document.getElementById('mapPreview');
    if(p) p.remove();
  }
}

document.addEventListener('click', e => {
  if(e.target.closest('.legend-pill,.tab-btn,.wine-card,.map-preview,.filter-btn,button,input,select,textarea,a')) return;
  if(selectedId !== null || sommHighlightIds){
    selectedId = null;
    sommHighlightIds = null;
    updateMapSelectionClasses();

function showMapPreview(w, leftPct, topPct){
  const canvas = document.getElementById('mapCanvas');
  const old = document.getElementById('mapPreview');
  if(old) old.remove();

  const color = TYPE_COLOR[w.tipo]||'#888';
  const aromaItems = [];
  if(w.varietal) aromaItems.push(w.varietal.split('·')[0].trim());
  if(w.region)   aromaItems.push(w.region.split(',')[0].trim());
  if(w.crianza && w.crianza !== '-') aromaItems.push(w.crianza.split('·')[0].trim());
  const aromaChips = aromaItems.slice(0,3).map(a=>`<div class="mpv-aroma">${esc(a)}</div>`).join('');

  const preview = document.createElement('div');
  preview.id = 'mapPreview';

  // Lógica de posición: siempre mostrar DEBAJO de la copa
  // así nunca se corta con el borde superior del canvas
  // Solo mostrar arriba si la copa está en el 75% inferior Y hay espacio
  const showAbove = topPct > 68;
  preview.className = 'map-preview' + (showAbove ? ' above' : '');

  // Top: debajo de la copa por defecto, arriba solo si copa muy abajo
  const pinOffsetPct = 8; // margen desde la copa
  const previewTopPct = showAbove
    ? topPct - pinOffsetPct   // arriba de la copa
    : topPct + pinOffsetPct;  // abajo de la copa

  // Horizontal: clamp para no salirse del canvas
  let previewLeft = leftPct;
  if(leftPct < 28) previewLeft = 28;
  if(leftPct > 72) previewLeft = 72;

  // Vertical: clamp mínimo
  const clampedTop = Math.max(3, Math.min(92, previewTopPct));

  preview.style.cssText = `left:${previewLeft}%;top:${clampedTop}%;transform:translate(-50%,${showAbove?'-100%':'0'})`;

  preview.innerHTML = `
    <div class="map-preview-inner">
      <div class="mpv-header">
        ${copitaSVG(color,{size:18})}
        <div>
          <div class="mpv-name">${esc(w.nombre)}</div>
          <div class="mpv-bodega">${esc(w.bodega)}</div>
        </div>
      </div>
      <div class="mpv-divider"></div>
      <div class="mpv-row">
        <div class="mpv-tipo" style="color:${color}">${esc(w.tipo)}</div>
        <div class="mpv-price">${fmtPrecio(w.precio)}</div>
      </div>
      ${aromaChips ? `<div class="mpv-aromas">${aromaChips}</div>` : ''}
    </div>`;

  canvas.appendChild(preview);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ preview.classList.add('show'); }); });
}

/* ══════════════════════════════════════
   ZOOM — pinch, scroll, doble tap, botones
══════════════════════════════════════ */
let mapZoom = 1;
let mapPanX = 0;
let mapPanY = 0;
const ZOOM_MIN = 1;
const ZOOM_MAX = 3.5;
const LABEL_ZOOM_THRESHOLD = 2.2;

function applyMapTransform(animate){
  const inner = document.getElementById('mapInner');
  if(!inner) return;
  inner.style.transition = animate ? 'transform .25s cubic-bezier(.22,1,.36,1)' : 'none';
  inner.style.transform = `translate(${mapPanX}px,${mapPanY}px) scale(${mapZoom})`;
  const hasZoom = mapZoom > 1.05;
  document.getElementById('zoomResetBtn').style.display = hasZoom ? 'flex' : 'none';
  document.getElementById('mapCanvas').classList.toggle('zoomed', hasZoom);
  updateZoomLabels();
}

function updateZoomLabels(){
  const show = mapZoom >= LABEL_ZOOM_THRESHOLD;
  // Escalar labels inversamente al zoom → tamaño constante en pantalla
  const s = show ? +(1 / mapZoom).toFixed(3) : 1;
  document.querySelectorAll('.wine-pin').forEach(p=>{
    p.classList.toggle('pin-label-visible', show);
    const lbl = p.querySelector('.pin-zoom-label');
    if(lbl) lbl.style.transform = `translateX(-50%) scale(${s})`;
  });
}

function clampPan(){
  const canvas = document.getElementById('mapCanvas');
  const cw = canvas.offsetWidth, ch = canvas.offsetHeight;
  // Máximo desplazamiento = cuánto crece el contenido con el zoom
  const maxX = (cw  * (mapZoom - 1)) / 2;
  const maxY = (ch * (mapZoom - 1)) / 2;
  mapPanX = Math.max(-maxX, Math.min(maxX, mapPanX));
  mapPanY = Math.max(-maxY, Math.min(maxY, mapPanY));
}

function zoomAroundPoint(newZoom, clientX, clientY){
  const canvas = document.getElementById('mapCanvas');
  const rect = canvas.getBoundingClientRect();
  // Punto en coordenadas del canvas (0,0 = top-left)
  const px = clientX - rect.left;
  const py = clientY - rect.top;
  // Punto en coordenadas del canvas centrado (0,0 = center)
  const cx = px - rect.width  / 2;
  const cy = py - rect.height / 2;
  // Para que el punto bajo el cursor no se mueva:
  // newPan = oldPan + (cx * (1/oldZoom - 1/newZoom)) * oldZoom * newZoom  → simplificado:
  // newPan = cx + (mapPanX - cx) * (newZoom / mapZoom)
  const prevZoom = mapZoom;
  mapZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
  mapPanX = cx + (mapPanX - cx) * (mapZoom / prevZoom);
  mapPanY = cy + (mapPanY - cy) * (mapZoom / prevZoom);
  clampPan();
}

function adjustZoom(delta, clientX, clientY){
  const canvas = document.getElementById('mapCanvas');
  const rect = canvas.getBoundingClientRect();
  const cx = clientX !== undefined ? clientX : rect.left + rect.width/2;
  const cy = clientY !== undefined ? clientY : rect.top  + rect.height/2;
  zoomAroundPoint(mapZoom + delta, cx, cy);
  applyMapTransform(true);
  document.getElementById('zoomHint').classList.add('hide');
}

function resetZoom(){
  mapZoom = 1; mapPanX = 0; mapPanY = 0;
  applyMapTransform(true);
}

// ── Scroll wheel (desktop) ─────────────────────────────────────
document.getElementById('mapCanvas').addEventListener('wheel', e=>{
  e.preventDefault();
  adjustZoom(e.deltaY < 0 ? 0.25 : -0.25, e.clientX, e.clientY);
}, {passive:false});

// ── Touch: pinch + pan ────────────────────────────────────────
let pinchStartDist = 0;
let pinchStartZoom = 1;
let pinchStartPanX = 0;
let pinchStartPanY = 0;
let pinchMidX = 0, pinchMidY = 0;
let isPinching = false;
let isPanning  = false;
let panStartX = 0, panStartY = 0;
let panStartMapX = 0, panStartMapY = 0;
let lastTapTime = 0;
let touchMoved = false;

document.getElementById('mapCanvas').addEventListener('touchstart', e=>{
  touchMoved = false;
  if(e.touches.length === 2){
    isPinching = true;
    isPanning  = false;
    const t1 = e.touches[0], t2 = e.touches[1];
    pinchStartDist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
    pinchStartZoom = mapZoom;
    pinchStartPanX = mapPanX;
    pinchStartPanY = mapPanY;
    pinchMidX = (t1.clientX + t2.clientX) / 2;
    pinchMidY = (t1.clientY + t2.clientY) / 2;
    e.preventDefault();
  } else if(e.touches.length === 1){
    const t = e.touches[0];
    const now = Date.now();
    // Doble tap → zoom in/out
    if(now - lastTapTime < 280 && !touchMoved){
      if(mapZoom > 1.5) resetZoom();
      else adjustZoom(0.8, t.clientX, t.clientY);
      lastTapTime = 0;
      e.preventDefault();
      return;
    }
    lastTapTime = now;
    // Iniciar pan siempre (si hay zoom se arrastra, si no hay zoom solo toca)
    isPanning = true;
    panStartX = t.clientX;
    panStartY = t.clientY;
    panStartMapX = mapPanX;
    panStartMapY = mapPanY;
  }
}, {passive:false});

document.getElementById('mapCanvas').addEventListener('touchmove', e=>{
  touchMoved = true;
  if(isPinching && e.touches.length === 2){
    e.preventDefault();
    const t1=e.touches[0], t2=e.touches[1];
    const dist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
    const scale = dist / pinchStartDist;
    const newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, pinchStartZoom * scale));
    // Pan proporcional al zoom
    const midX = (t1.clientX + t2.clientX) / 2;
    const midY = (t1.clientY + t2.clientY) / 2;
    const canvas = document.getElementById('mapCanvas');
    const rect = canvas.getBoundingClientRect();
    const cx = pinchMidX - rect.left - rect.width/2;
    const cy = pinchMidY - rect.top  - rect.height/2;
    mapZoom = newZoom;
    mapPanX = cx + (pinchStartPanX - cx) * (newZoom / pinchStartZoom) + (midX - pinchMidX);
    mapPanY = cy + (pinchStartPanY - cy) * (newZoom / pinchStartZoom) + (midY - pinchMidY);
    clampPan();
    applyMapTransform(false);
    document.getElementById('zoomHint').classList.add('hide');
  } else if(isPanning && e.touches.length === 1 && mapZoom > 1.05){
    e.preventDefault();
    const t = e.touches[0];
    mapPanX = panStartMapX + (t.clientX - panStartX);
    mapPanY = panStartMapY + (t.clientY - panStartY);
    clampPan();
    applyMapTransform(false);
  }
}, {passive:false});

document.getElementById('mapCanvas').addEventListener('touchend', e=>{
  if(e.touches.length < 2) isPinching = false;
  if(e.touches.length === 0) isPanning = false;
});

// ── Doble click desktop ────────────────────────────────────────
document.getElementById('mapCanvas').addEventListener('dblclick', e=>{
  if(e.target.closest('.wine-pin')) return;
  if(mapZoom > 1.5) resetZoom();
  else adjustZoom(0.8, e.clientX, e.clientY);
});

// ── Mouse pan (desktop con zoom) ──────────────────────────────
let isMousePanning = false;
let mousePanStartX = 0, mousePanStartY = 0;
let mousePanMapX = 0, mousePanMapY = 0;

document.getElementById('mapCanvas').addEventListener('mousedown', e=>{
  if(mapZoom <= 1.05 || e.target.closest('.wine-pin') || e.target.closest('.zoom-controls')) return;
  isMousePanning = true;
  mousePanStartX = e.clientX; mousePanStartY = e.clientY;
  mousePanMapX = mapPanX; mousePanMapY = mapPanY;
  document.getElementById('mapCanvas').style.cursor = 'grabbing';
  e.preventDefault();
});
document.addEventListener('mousemove', e=>{
  if(!isMousePanning) return;
  mapPanX = mousePanMapX + (e.clientX - mousePanStartX);
  mapPanY = mousePanMapY + (e.clientY - mousePanStartY);
  clampPan();
  applyMapTransform(false);
});
document.addEventListener('mouseup', ()=>{
  if(!isMousePanning) return;
  isMousePanning = false;
  document.getElementById('mapCanvas').style.cursor = '';
});
let activeFilter = null;

// Cascada de barras sensoriales al entrar en viewport (handoff Paso 5/10).
function animatePerfilBars(){
  const bars = document.querySelectorAll('#fichaContent .perfil-bar-fill');
  if(!bars.length) return;
  const section = document.querySelector('#fichaContent .perfil-section');
  const reveal = () => bars.forEach((bar,i) => setTimeout(() => { bar.style.width = bar.dataset.target; }, i*60));
  if(!section || typeof IntersectionObserver === 'undefined'){ reveal(); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if(entry.isIntersecting){ reveal(); io.disconnect(); } });
  }, {threshold:.2});
  io.observe(section);
}

function volverAlMapa(){
  showTab('carta', document.querySelector('.tab-btn[onclick*="carta"]'));

async function compartirVino(id){
  const w = wines.find(x=>x.id===id);
  if(!w) return;
  const url = location.origin + location.pathname + '#vino=' + id;
  const shareData = { title: '125cc · ' + w.nombre, text: `Mirá este vino: ${w.nombre} (${w.bodega})`, url };
  if(navigator.share){
    try{ await navigator.share(shareData); return; }catch(e){ /* cancelado o no soportado: sigue al fallback */ }
  }
  try{
    await navigator.clipboard.writeText(url);
    const el = document.getElementById('shareBtnLabel');
    if(el){ const prev = el.textContent; el.textContent = '¡Copiado!'; setTimeout(()=>{ if(el.isConnected) el.textContent = prev; }, 1600); }
  }catch(e){
    prompt('Copiá este link:', url);
  }
}

  });
}

// Deriva un perfil de gusto implícito a partir del historial guardado en
// localStorage (mismo email que usa "Mis catas", sin login nuevo). Solo se
// activa con señal real: ≥2 catas Sommelier (las que tienen acidez/cuerpo/
// taninos cargados) puntuadas 85+ — si no, el flujo clásico de 4 preguntas
// queda exactamente igual que antes.
async function cargarPerfilImplicito(){
  perfilImplicitoCliente = null;
  let email = '';
  try{ email = localStorage.getItem('125cc_email')||''; }catch(e){}
  if(!email) return;
  try{
    const r = await fetch('/api/stats', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email})
    });
    const data = await r.json();
    const todas = data.catas || [];
    if(!todas.length) return;
    const buenas = todas.filter(c => (c.nivel||'').toLowerCase()==='sommelier' && Number(c.puntuacion)>=85);
    if(buenas.length < 2) return;
    const avg = key => buenas.reduce((s,c)=>s+(Number(c[key])||0),0)/buenas.length;
    perfilImplicitoCliente = {
      cuerpo: avg('cuerpo'),
      frescura: avg('acidez'), // la cata no guarda "frescura" — acidez es el proxy sensorial más cercano
      taninos: avg('taninos'),
      ultimaCata: todas[0], // la más reciente en general (no solo las que alimentan el perfil)
    };
  }catch(e){ perfilImplicitoCliente = null; }
}

function answerSomm(el, qid, val){

// Terciles de precio sobre el catálogo VIGENTE — reemplaza umbrales fijos que
// se desactualizarían solos con el recambio de carta cada 14 días.
function precioBandThresholds(){
  const precios = wines
    .map(w => parseFloat((w.precio||'0').toString().replace(/[$\.]/g,'').replace(',','.')))
    .filter(p => p>0)
    .sort((a,b)=>a-b);
  if(!precios.length) return {low:10000, high:14000};
  const low  = precios[Math.floor(precios.length/3)]   || precios[0];
  const high = precios[Math.floor(precios.length*2/3)] || precios[precios.length-1];
  return {low, high};
}

function renderSommResults(){
  const {low:precioLow, high:precioHigh} = precioBandThresholds();
  const scored=wines.map(w=>{
    let score=0, reasons=[];
    const {color,estilo,comida}=sommAnswers;

    // color match
    if(color==='tinto'&&w.tipo==='Tinto'){score+=3;reasons.push('es tinto');}
    if(color==='blanco'&&(w.tipo==='Blanco'||w.tipo==='Rosado')){score+=3;reasons.push('es fresco y liviano');}
    if(color==='naranja'){
      // Primero intentamos Naranjo/Pet Nat/ancestral
      if(w.tipo==='Naranja'||w.varietal.toLowerCase().includes('ancestral')||w.varietal.toLowerCase().includes('espumoso')){
        score+=4; reasons.push('es una elección diferente');
      } else if(w.tipo==='Blanco'||w.tipo==='Rosado'){
        // Fallback: recomendar blancos/rosados como opción distinta
        score+=3; reasons.push('es una alternativa fresca e inesperada');
      } else {
        score+=1; // tinto igualmente suma un poco
      }
    }
    if(color==='cualquiera'){score+=1;}

    // estilo match — perfil declarado (cuerpo/frescura/taninos) + posición
    // real del vino en el mapa (eje Y: Suave↔Potente) como score continuo,
    // en vez de un corte binario — dos vinos "serios" ya no empatan aunque
    // uno sea mucho más extremo que el otro.
    const cuerpo=w.perfil?w.perfil.cuerpo:3;
    const frescura=w.perfil?w.perfil.frescura:3;
    const taninos=w.perfil?w.perfil.taninos:3;
    if(estilo==='fresco'||estilo==='serio'){
      const yTarget = estilo==='fresco' ? -55 : 55;
      const proximidad = Math.max(0, 1-Math.abs((Number(w.y)||0)-yTarget)/160); // 0..1
      score += proximidad*3;
      if(estilo==='fresco' && frescura>=4){score+=1;reasons.push('entra fácil');}
      if(estilo==='serio' && (cuerpo>=4||taninos>=4)){score+=1;reasons.push('tiene estructura y cuerpo');}
    }
    if(estilo==='cualquiera'){score+=1;}

    // comida match
    if(comida==='tabla'&&w.maridaje&&w.maridaje.includes('tabla')){score+=2;reasons.push('va perfecto con tabla');}
    if(comida==='carnes'&&w.maridaje&&w.maridaje.includes('carnes rojas')){score+=2;reasons.push('ideal para carnes');}
    if(comida==='solo'){score+=1;}

    // precio match — terciles calculados sobre el catálogo vigente (ver precioBandThresholds)
    const precioNum = parseFloat((w.precio||'0').replace(/[$\\.]/g,'').replace(',','.'));
    if(sommAnswers.precio==='bajo'  && precioNum<=precioLow){score+=3;reasons.push('entra en tu presupuesto');}
    if(sommAnswers.precio==='medio' && precioNum>precioLow && precioNum<=precioHigh){score+=3;reasons.push('precio justo');}
    if(sommAnswers.precio==='alto'  && precioNum>precioHigh){score+=3;reasons.push('lo mejor de la carta');}
    if(sommAnswers.precio==='bajo'  && precioNum>precioHigh){score-=2;} // penalizar si pide barato y el vino es caro

    // perfil implícito del cliente (cargarPerfilImplicito) — catas Sommelier
    // propias bien puntuadas. Corre siempre que haya perfil, no solo en el
    // atajo "Algo parecido", así el flujo clásico también se afina con tu
    // historial real.
    if(perfilImplicitoCliente){
      const dist = Math.abs(cuerpo-perfilImplicitoCliente.cuerpo)
                 + Math.abs(frescura-perfilImplicitoCliente.frescura)
                 + Math.abs(taninos-perfilImplicitoCliente.taninos);
      const afinidad = Math.max(0, 2-dist*0.3);
      score += afinidad;
      if(afinidad>=1.3) reasons.push('parecido a lo que más te gustó antes');
    }

    // boost suave por puntuación real de clientes — desempata sin dominar el match de perfil
    const rating = wineRatings.get(w.nombre);
    if(rating && rating.count>=3){
      score += Math.max(0, (rating.puntuacion-85)/15*2);
      if(rating.puntuacion>=90) reasons.push('muy bien puntuado por otros clientes');
    }

    return {...w, score, reasons, _perfil:{cuerpo,frescura,taninos}};
  }).sort((a,b)=>b.score-a.score).slice(0,3);

  const rankColors=['#c8463a','#78716c','#a8a29e'];
  const rankLabel=['Ideal para vos','Segunda opción','También podría ser'];
  const sinPreguntas = !sommAnswers.color && !sommAnswers.estilo && !sommAnswers.comida && !sommAnswers.precio;
  const subtitulo = sinPreguntas && perfilImplicitoCliente ? 'Basado en lo que más te gustó antes' : 'Basado en lo que nos dijiste';

  const barraPerfil = (label,val,color) => `
    <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
      <div style="width:56px;font-size:10px;color:var(--ink-3);flex-shrink:0">${label}</div>
      <div style="flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden">
        <div style="height:100%;width:${(val/5*100)}%;background:${color}"></div>
      </div>
    </div>`;

  document.getElementById('sommContent').innerHTML=`
    <div class="somm-results" style="display:block">
      <h3>Tus vinos de esta noche</h3>
      <p>${subtitulo}</p>
      ${scored.map((w,i)=>{
        const color = TYPE_COLOR[w.tipo] || '#888';
        const isHero = i===0;
        return `
        <div class="somm-result-card${isHero?' somm-result-hero':''}" style="animation-delay:${i*380}ms" onclick="selectWineFromSomm(${w.id})">
          <div class="src-header">
            <div class="src-rank" style="background:${rankColors[i]}">${i+1}</div>
            <div style="flex:1;min-width:0">
              <div class="src-name">${esc(w.nombre)}</div>
              <div class="src-why">${esc(rankLabel[i])}${w.reasons.length?' · '+esc(w.reasons.join(', ')):''}</div>
            </div>
          </div>
          <div class="src-price">${fmtPrecio(w.precio)} · ${esc(w.copa||'125 cc')}</div>
          ${isHero ? `
          <div style="margin-top:10px">
            ${barraPerfil('Cuerpo', w._perfil.cuerpo, color)}
            ${barraPerfil('Frescura', w._perfil.frescura, color)}
            ${barraPerfil('Taninos', w._perfil.taninos, color)}
          </div>` : ''}
          <div class="src-maridaje">
            ${(w.maridaje||[]).slice(0,3).map(m=>`<div class="src-pill">${MARIDAJE_ICON[m]||''} ${esc(m)}</div>`).join('')}
          </div>
        </div>`;
      }).join('')}
      <button class="btn-terciario" style="margin-bottom:12px" onclick="verEnMapaDesdeSomm([${scored.map(w=>w.id).join(',')}])">📍 Ver estos 3 en el mapa</button>
      <div style="background:var(--dark);border-radius:var(--r-card);padding:14px;margin-top:4px;margin-bottom:8px;text-align:center">
        <div style="font-size:var(--text-kicker);color:var(--ink-3);margin-bottom:4px;letter-spacing:.08em;text-transform:uppercase">Sommelier en el salón</div>
        <div style="font-size:var(--text-data);color:var(--ink-dark-2);line-height:1.5">Contale tus preferencias y te guía al vino perfecto para esta noche.</div>
      </div>
      <button class="somm-restart btn-terciario" onclick="startSommelier()">Volver a empezar</button>
    </div>`;
}
