<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>125cc · Cocina</title>
<style>
  /* Pantalla de cocina/barra (handoff/ANALISIS-POS-SISTEMA-COMPLETO.md,
     hallazgo 1) — deliberadamente separada de pos.html: vive en una
     tablet/pantalla fija en cocina, sin el resto del POS (salón, caja,
     cobro) que no le hace falta a quien cocina. Reusa el MISMO
     POS_PASSWORD que pos.html (api/_lib/require-pos.js) — "cómo se
     logea cocina" (login propio, PIN corto, sin password) queda para
     más adelante, esto es el default que ya funciona hoy sin inventar
     nada nuevo.
     Pantalla grande, alto contraste, texto grande — se mira de lejos y
     rápido, no se usa como una pantalla de escritorio normal. */
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#14181D; --card:#1E252D; --card-2:#262F39; --line:#333D48;
    --ink:#F2F0EA; --ink-2:#B8C0CC; --ink-3:#7A8694;
    --accent:#D2607A; --green:#3FAE6C; --amber:#E0A83E;
  }
  html,body{background:var(--bg);color:var(--ink);font-family:'DM Sans',-apple-system,Segoe UI,sans-serif;min-height:100vh;overflow-x:hidden}
  button{font-family:inherit;cursor:pointer}

  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-box{width:100%;max-width:360px;text-align:center}
  .login-logo{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
  .login-sub{color:var(--ink-3);font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:28px}
  .login-box input{width:100%;min-height:56px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 16px;color:var(--ink);font-size:20px;outline:none;text-align:center;margin-bottom:12px}
  .login-btn{width:100%;min-height:56px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:18px;font-weight:700}
  .login-error{display:none;color:#F08298;font-size:14px;margin-top:10px}

  #app{display:none;min-height:100vh}
  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .top-logo{font-size:20px;font-weight:700}
  .top-sub{color:var(--ink-3);font-size:13px;margin-top:1px}
  .top-right{display:flex;align-items:center;gap:12px}
  .conteo-pendientes{background:var(--card-2);border-radius:20px;padding:6px 14px;font-weight:700;font-size:15px}
  .logout-btn{background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:10px;padding:10px 14px;font-size:14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:16px}
  .empty-state{padding:80px 20px;text-align:center;color:var(--ink-3);font-size:18px}

  .mesa-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .mesa-card-head{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .mesa-nombre{font-size:20px;font-weight:700}
  .mesa-tiempo{font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--card-2);color:var(--ink-2)}
  .mesa-tiempo.viejo{background:rgba(224,168,62,.22);color:var(--amber)}
  .mesa-tiempo.muy-viejo{background:rgba(210,96,122,.22);color:var(--accent)}

  .item-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .item-row:last-child{border-bottom:none}
  .item-cant{font-size:22px;font-weight:700;color:var(--accent);flex-shrink:0;min-width:34px}
  .item-nombre{flex:1;font-size:18px;font-weight:600;line-height:1.25}
  .btn-listo{flex-shrink:0;min-height:46px;padding:0 18px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700}
  .btn-listo:active{opacity:.7}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">125cc</div>
    <div class="login-sub">Cocina</div>
    <input type="password" id="passInput" placeholder="••••••" maxlength="40"
      onkeydown="if(event.key==='Enter') tryLogin()">
    <button class="login-btn" onclick="tryLogin()">Entrar</button>
    <div class="login-error" id="loginError">Contraseña incorrecta.</div>
  </div>
</div>

<div id="app">
  <div class="top-bar">
    <div>
      <div class="top-logo">125cc</div>
      <div class="top-sub">Cocina</div>
    </div>
    <div class="top-right">
      <div class="conteo-pendientes" id="conteoPendientes">0</div>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
  </div>
  <div id="grid" class="grid"></div>
</div>

<script>
const SESSION_KEY = "125cc_pos_auth"; // mismo token que pos.html — comparten POS_PASSWORD

function authHeader(){
  return { 'Authorization': 'Bearer ' + (sessionStorage.getItem(SESSION_KEY) || '') };
}

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({}, authHeader(), opts.body ? {'Content-Type':'application/json'} : {}, opts.headers || {});
  const res = await fetch(path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (res.status === 401){ logout(); throw new Error('No autorizado'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
  return data;
}

async function tryLogin(){
  const pass = document.getElementById('passInput').value;
  document.getElementById('loginError').style.display = 'none';
  try {
    const res = await fetch('/api/pos?r=auth', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: pass }) });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error();
    sessionStorage.setItem(SESSION_KEY, pass);
    enterApp();
  } catch(e){
    document.getElementById('loginError').style.display = 'block';
  }
}

function logout(){
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  if (pollHandle) clearInterval(pollHandle);
}

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  cargarCola();
  iniciarPolling();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Cada cuánto refresca — más seguido que el salón de pos.html (10s):
// acá importa más la latencia, es la señal de "hay que cocinar esto".
let pollHandle = null;
function iniciarPolling(){
  if (pollHandle) clearInterval(pollHandle);
  pollHandle = setInterval(() => {
    if (document.visibilityState === 'visible') cargarCola();
  }, 6000);
}

function minutosDesde(iso){
  return Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
}

async function cargarCola(){
  try {
    const data = await api('/api/pos?r=cocina');
    renderCola(data.items);
  } catch(e){ /* silencioso — el próximo poll reintenta solo */ }
}

function renderCola(items){
  document.getElementById('conteoPendientes').textContent = items.length;
  const grid = document.getElementById('grid');
  if (!items.length){
    grid.innerHTML = '<div class="empty-state">Sin pedidos pendientes — todo al día.</div>';
    return;
  }
  // Agrupar por comanda (mesa) — a cocina le sirve ver "qué le falta a
  // esta mesa", no una lista plana sin contexto.
  const porComanda = new Map();
  items.forEach(it => {
    if (!porComanda.has(it.comanda_id)) porComanda.set(it.comanda_id, { mesa_nombre: it.mesa_nombre, items: [], masViejo: it.created_at });
    const g = porComanda.get(it.comanda_id);
    g.items.push(it);
    if (new Date(it.created_at) < new Date(g.masViejo)) g.masViejo = it.created_at;
  });
  // Mesas con el pedido más viejo primero — la más urgente arriba.
  const grupos = [...porComanda.values()].sort((a, b) => new Date(a.masViejo) - new Date(b.masViejo));

  grid.innerHTML = grupos.map(g => {
    const min = minutosDesde(g.masViejo);
    const claseTiempo = min >= 15 ? 'muy-viejo' : (min >= 8 ? 'viejo' : '');
    return `
    <div class="mesa-card">
      <div class="mesa-card-head">
        <div class="mesa-nombre">${escapeHtml(g.mesa_nombre || 'Takeaway')}</div>
        <div class="mesa-tiempo ${claseTiempo}">${min < 1 ? 'recién' : min + ' min'}</div>
      </div>
      ${g.items.map(it => `
        <div class="item-row">
          <div class="item-cant">${it.cantidad}×</div>
          <div class="item-nombre">${escapeHtml(it.nombre_snapshot)}</div>
          <button class="btn-listo" onclick="marcarListo(${it.id}, this)">Listo</button>
        </div>`).join('')}
    </div>`;
  }).join('');
}

async function marcarListo(itemId, btn){
  btn.disabled = true;
  btn.textContent = '...';
  try {
    await api('/api/pos?r=cocina-marcar', { method: 'POST', body: { item_id: itemId } });
    cargarCola();
  } catch(e){
    btn.disabled = false;
    btn.textContent = 'Listo';
  }
}

if (sessionStorage.getItem(SESSION_KEY)) enterApp();
</script>
</body>
</html>
