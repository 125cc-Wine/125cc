<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>125cc · POS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">
<style>
  /* Paleta propia para esta página — tema claro tipo Fudo, independiente
     de los tokens oscuros de handoff/tokens.css (esos son para el menú
     de clientes; este es un panel de trabajo de piso). */
  :root{
    /* Paleta 125cc (madera/piedra/cuero/tinto) — misma familia de la marca
       en vez del naranja tipo Fudo que había antes. Se mantienen los
       NOMBRES de variable existentes (--green/--red/--blue/--amber/etc.)
       para no tener que tocar cada punto donde se usan; solo cambian los
       valores. Mapeo: --ink=text, --ink-3=muted, --navbar=madera-dk,
       --navbar-2=madera-mid, --green=vino blanco (libre), --red=tinto
       (ocupada/error), --blue=piedra (cuenta_pedida — el nombre quedó
       heredado, ya no es literalmente azul), --amber=madera roble claro
       (selección), --black=madera-dk (nunca #000 puro). */
    --bg:#FAF5EE; --surface:#FFFFFF; --ink:#2A1A08; --ink-2:#5A4534; --ink-3:#8A7060;
    --line:#E4D8C8;
    --navbar:#4A3020; --navbar-2:#8B6A3A;
    --green:#5A8A2A; --red:#7A1428; --blue:#C4785A; --amber:#C8A46A;
    --accent:#7A1428; --accent-2:#9B2035; --accent-dk:#5E0F1F;
    --accent-grad:linear-gradient(135deg,#7A1428,#9B2035);
    --black:#4A3020;
    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
    --shadow:0 1px 3px rgba(20,20,25,.08), 0 1px 2px rgba(20,20,25,.06);
    --shadow-md:0 4px 14px rgba(20,20,25,.10);
    --ease:cubic-bezier(.22,1,.36,1); --t:150ms;

    /* Escala tipográfica — 7 pasos en vez de los ~18 tamaños sueltos que
       había antes, para que el texto tenga un ritmo consistente. */
    --fs-2xs:9px; --fs-xs:10.5px; --fs-sm:12px; --fs-base:13.5px;
    --fs-md:15px; --fs-lg:18px; --fs-xl:22px;

    /* Escala de espaciado — base 4. */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px;

    /* Alto mínimo de toque recomendado para uso con el dedo en una barra
       con poca luz (Apple HIG / Material: ~44px). */
    --tap-min:40px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:var(--fs-base);line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent}
  button,input,select{font-family:inherit}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ── LOGIN ── */
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:var(--sp-5);background:var(--navbar)}
  .login-box{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:var(--sp-6) var(--sp-5);width:100%;max-width:340px;text-align:center}
  .login-logo{font-weight:700;font-size:32px;color:var(--accent);letter-spacing:-.02em;margin-bottom:2px}
  .login-sub{font-size:var(--fs-xs);letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase;margin-bottom:var(--sp-6)}
  .login-box input{width:100%;min-height:48px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:0 var(--sp-4);color:var(--ink);font-size:var(--fs-md);outline:none;text-align:center;margin-bottom:var(--sp-3);transition:border-color var(--t) var(--ease)}
  .login-box input:focus{border-color:var(--accent)}
  .login-btn{width:100%;min-height:48px;background:var(--accent-grad);border:none;border-radius:var(--r-md);color:#fff;font-size:var(--fs-sm);font-weight:700;letter-spacing:.04em;cursor:pointer;transition:transform var(--t) var(--ease),filter var(--t) var(--ease)}
  .login-btn:active{transform:scale(.98)}
  .login-btn:hover{filter:brightness(.92)}
  .login-error{font-size:var(--fs-sm);color:var(--red);margin-top:var(--sp-2);display:none}

  /* ── SHELL ── */
  #app{display:none}
  .top-bar{background:var(--navbar);padding:var(--sp-3) var(--sp-4);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .top-logo{font-weight:700;font-size:19px;color:var(--accent);letter-spacing:-.02em}
  .top-label{font-size:var(--fs-2xs);letter-spacing:.16em;color:rgba(255,255,255,.5);text-transform:uppercase;margin-top:1px}
  .top-right{display:flex;align-items:center;gap:var(--sp-4)}
  .top-staff{font-size:var(--fs-xs);color:rgba(255,255,255,.75)}
  .logout-btn{font-size:var(--fs-sm);color:rgba(255,255,255,.6);cursor:pointer;background:none;border:none;min-height:var(--tap-min);padding:0 var(--sp-1);transition:color var(--t) var(--ease)}
  .logout-btn:hover{color:#fff}
  .view{padding:var(--sp-4) var(--sp-4) 40px}

  .section-title{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-bottom:var(--sp-3);font-weight:700}

  /* ── LAYOUT DIVIDIDO: salón + comanda ── */
  .salon-split{display:flex;flex-direction:column;gap:var(--sp-5)}
  @media(min-width:680px){
    /* ~65/35 mesas-comanda, como en la referencia (no un panel angosto
       fijo de comanda estirándose a lo ancho en pantallas grandes). */
    .salon-split{flex-direction:row;align-items:flex-start}
    .salon-left{flex:0 0 62%}
    .salon-right{flex:1;min-width:0;max-width:38%}
  }

  .salon-toolbar{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4);flex-wrap:wrap}

  /* Sin card: los círculos flotan directo sobre el fondo de la página,
     como en la referencia — no hay una caja de tamaño fijo conteniéndolos.
     Las posiciones de los pines son porcentuales (position:absolute no
     hace crecer al padre solo), así que en vez de una altura fija se usa
     aspect-ratio: escala con el ancho real del panel — más chico en el
     celu, más grande en tablet donde el panel de mesas ahora es ~62% del
     ancho — sin quedar vacío ni apretado en ningún tamaño de pantalla. */
  .salon-stage{position:relative;aspect-ratio:16/10;min-height:170px;max-height:320px;padding:var(--sp-4) 0;touch-action:none}
  .salon-hint{padding:var(--sp-6) var(--sp-4);color:var(--ink-3);font-size:var(--fs-sm);line-height:1.6;text-align:center;pointer-events:none}
  .salon-pin{position:absolute;transform:translate(-50%,-50%);width:64px;text-align:center;user-select:none;-webkit-user-select:none;z-index:5;cursor:pointer}
  .salon-pin.dragging{z-index:30}
  .salon-editing .salon-pin{cursor:grab}
  .salon-editing .salon-pin:active{cursor:grabbing}
  .salon-pin-dotwrap{position:relative;width:54px;margin:0 auto}
  .salon-pin-dot{width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-md);box-shadow:0 2px 8px rgba(20,20,25,.2);border:2px solid rgba(255,255,255,.8);transition:outline .12s,transform var(--t) var(--ease)}
  .salon-pin:not(.dragging):active .salon-pin-dot{transform:scale(.92)}
  .salon-pin.ocupada .salon-pin-dot{background:var(--red)}
  .salon-pin.cuenta_pedida .salon-pin-dot{background:var(--blue)}
  .salon-pin.selected .salon-pin-dot{outline:4px solid var(--amber);outline-offset:3px}
  .salon-pin-badge{position:absolute;bottom:-2px;right:-2px;background:var(--surface);color:var(--ink);font-size:var(--fs-2xs);font-weight:700;border-radius:50%;width:19px;height:19px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
  .salon-pin-label{font-size:var(--fs-2xs);color:var(--ink-2);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px;margin-left:auto;margin-right:auto}

  .row-btns{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-5);flex-wrap:wrap}
  /* Los tres botones comparten el mismo padding vertical y min-height, así
     quedan alineados cuando conviven en la misma fila (ej: Cobrar + +Producto). */
  .btn-outline,.btn-primary,.btn-black{
    min-height:var(--tap-min);padding:0 var(--sp-4);border-radius:var(--r-sm);
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    font-size:var(--fs-sm);font-weight:700;border:none;
  }
  .btn-outline{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-weight:500;transition:border-color var(--t) var(--ease),color var(--t) var(--ease)}
  .btn-outline:hover{border-color:var(--ink-3);color:var(--ink)}
  .btn-primary{background:var(--accent-grad);color:#fff;transition:transform var(--t) var(--ease),filter var(--t) var(--ease)}
  .btn-primary:active{transform:scale(.97)}
  .btn-primary:hover{filter:brightness(.92)}
  .btn-black{background:var(--black);color:#fff;letter-spacing:.04em;text-transform:uppercase;transition:opacity var(--t) var(--ease)}
  .btn-black:hover{opacity:.85}

  .quick-form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-4);margin-bottom:var(--sp-3);display:none;box-shadow:var(--shadow)}
  .quick-form.open{display:block}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2);margin-bottom:var(--sp-2)}
  .quick-form input,.quick-form select{width:100%;min-height:var(--tap-min);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 var(--sp-3);color:var(--ink);font-size:var(--fs-base);outline:none;transition:border-color var(--t) var(--ease)}
  .quick-form input:focus,.quick-form select:focus{border-color:var(--accent)}
  .quick-form-actions{display:flex;gap:var(--sp-2);margin-top:var(--sp-1)}

  /* ── PANEL DE COMANDA ── */
  .panel-empty{padding:var(--sp-6) var(--sp-5);text-align:center;color:var(--ink-3);font-size:var(--fs-sm);line-height:1.7;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
  .comanda-card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;margin-bottom:var(--sp-5)}
  .comanda-header{background:var(--red);padding:var(--sp-4) var(--sp-5);display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-2)}
  .comanda-header.takeaway{background:var(--blue)}
  .comanda-title{font-size:var(--fs-lg);font-weight:700;color:#fff;letter-spacing:.02em}
  .comanda-sub{font-size:var(--fs-xs);color:rgba(255,255,255,.8);margin-top:2px}
  .close-btn{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:14px;cursor:pointer;width:32px;height:32px;border-radius:50%;flex-shrink:0;transition:background var(--t) var(--ease)}
  .close-btn:hover{background:rgba(255,255,255,.3)}

  .items-box{border-top:1px solid var(--line)}
  .item-row{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-4);border-bottom:1px solid var(--line);min-height:56px}
  .item-row:last-child{border-bottom:none}
  .qty-stepper{display:flex;align-items:center;gap:var(--sp-1);flex-shrink:0}
  .qty-btn{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);color:var(--ink-2);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color var(--t) var(--ease),color var(--t) var(--ease)}
  .qty-btn:hover{border-color:var(--ink-3);color:var(--ink)}
  .qty-btn:active{transform:scale(.94)}
  .qty-val{font-size:var(--fs-base);font-weight:700;color:var(--ink);width:20px;text-align:center;flex-shrink:0}
  .item-name{font-size:var(--fs-base);color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item-price{font-size:var(--fs-base);font-weight:700;color:var(--ink);flex-shrink:0}
  .item-remove{background:none;border:none;color:var(--ink-3);font-size:16px;cursor:pointer;padding:var(--sp-2);margin:calc(var(--sp-2) * -1);flex-shrink:0;border-radius:var(--r-sm);transition:color var(--t) var(--ease)}
  .item-remove:hover{color:var(--red)}
  .items-empty{padding:var(--sp-6) var(--sp-3);text-align:center;color:var(--ink-3);font-size:var(--fs-sm);line-height:1.6}

  .total-bar{background:var(--navbar-2);padding:var(--sp-4) var(--sp-5);display:flex;align-items:center;justify-content:space-between}
  .total-label{font-size:var(--fs-xs);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:700}
  .total-val{font-size:var(--fs-xl);color:#fff;font-weight:700}

  .prod-search{width:100%;min-height:var(--tap-min);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill);padding:0 var(--sp-4);color:var(--ink);font-size:var(--fs-base);outline:none;margin-bottom:var(--sp-3);transition:border-color var(--t) var(--ease)}
  .prod-search:focus{border-color:var(--accent)}
  .cat-chips{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-bottom:var(--sp-3)}
  .cat-chip{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:var(--fs-xs);font-weight:500;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-pill);cursor:pointer;transition:background var(--t) var(--ease),color var(--t) var(--ease)}
  .cat-chip.active{background:var(--ink);border-color:var(--ink);color:#fff}

  .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:var(--sp-2);margin-bottom:var(--sp-5)}
  .prod-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-3);min-height:var(--tap-min);cursor:pointer;box-shadow:var(--shadow);transition:transform var(--t) var(--ease),border-color var(--t) var(--ease)}
  .prod-card:active{transform:scale(.96)}
  .prod-card.sin-stock{opacity:.45}
  .prod-name{font-size:var(--fs-sm);color:var(--ink);line-height:1.35;font-weight:500}
  .prod-unidad{font-size:var(--fs-2xs);color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
  .prod-price{font-size:var(--fs-md);font-weight:700;color:var(--accent);margin-top:5px}
  .prod-stock-low{font-size:var(--fs-2xs);color:#B45309;margin-top:3px;font-weight:500}

  .cobrar-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);padding:var(--sp-4);margin-bottom:var(--sp-5);display:none}
  .cobrar-panel.open{display:block}

  /* ── MODAL (Stock/Caja/Reportes) ──────────────────────────────────
     Antes estos paneles se abrían empujando el resto de la página hacia
     abajo, podían quedar varios abiertos a la vez, y no había forma clara
     de saber cuál estaba activo. Ahora son modales superpuestos: fondo
     oscurecido, uno solo a la vez, cierre explícito (✕ o tocar afuera). */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,20,25,.5);z-index:90;opacity:0;pointer-events:none;transition:opacity var(--t) var(--ease)}
  .modal-backdrop.open{opacity:1;pointer-events:auto}
  .modal-panel{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);
    width:min(92vw,480px);max-height:85vh;overflow-y:auto;z-index:95;
    opacity:0;pointer-events:none;transition:opacity var(--t) var(--ease),transform var(--t) var(--ease);
  }
  .modal-panel.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  @media(max-width:520px){
    .modal-panel{width:100vw;max-width:100vw;height:100%;max-height:100%;top:0;left:0;transform:none;border-radius:0}
    .modal-panel.open{transform:none}
  }
  .nav-active{color:#fff !important;position:relative}
  .nav-active::after{content:'';position:absolute;left:var(--sp-1);right:var(--sp-1);bottom:2px;height:2px;background:var(--accent);border-radius:2px}

  /* ── STOCK / CAJA / REPORTES (paneles genéricos de fila+valor) ── */
  .stock-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-md);padding:var(--sp-4);margin-bottom:var(--sp-4)}
  .stock-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-3)}
  .stock-row{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) 0;border-bottom:1px solid var(--line);min-height:36px}
  .stock-row:last-child{border-bottom:none}
  .stock-row-name{flex:1;font-size:var(--fs-sm);color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stock-row-name-sub{font-size:var(--fs-2xs);color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
  .stock-input{width:64px;min-height:36px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:0 var(--sp-2);font-size:var(--fs-sm);text-align:center;outline:none;flex-shrink:0;transition:border-color var(--t) var(--ease)}
  .stock-input:focus{border-color:var(--accent)}

  /* Toast */
  .toast{position:fixed;bottom:var(--sp-5);left:50%;transform:translateX(-50%) translateY(20px);background:var(--navbar);color:#fff;padding:var(--sp-3) var(--sp-5);border-radius:var(--r-pill);font-size:var(--fs-base);opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:200;box-shadow:var(--shadow-md)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.success{background:#1F7A45}
  .toast.error{background:var(--red)}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">125cc</div>
    <div class="login-sub">Piso · POS</div>
    <input type="text" id="staffInput" placeholder="¿Quién atiende?" maxlength="40">
    <input type="password" id="passInput" placeholder="••••••" maxlength="40"
      onkeydown="if(event.key==='Enter') tryLogin()">
    <button class="login-btn" onclick="tryLogin()">Entrar</button>
    <div class="login-error" id="loginError">Contraseña incorrecta.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="top-bar">
    <div>
      <div class="top-logo">125cc</div>
      <div class="top-label">Salón</div>
    </div>
    <div class="top-right">
      <div class="top-staff" id="topStaff"></div>
      <button class="logout-btn" id="navReportes" onclick="togglePanel('reportes')">Reportes</button>
      <button class="logout-btn" id="navCaja" onclick="togglePanel('caja')">Caja</button>
      <button class="logout-btn" id="navStock" onclick="togglePanel('stock')">Stock</button>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" onclick="closeAllPanels()"></div>

  <div class="view">
    <div class="stock-panel modal-panel" id="reportesPanel">
      <div class="stock-panel-header">
        <div class="section-title" style="margin-bottom:0">Reportes</div>
        <button class="close-btn" onclick="closeAllPanels()" title="Cerrar">✕</button>
      </div>
      <div class="row-btns" style="margin-bottom:14px">
        <button class="cat-chip active" id="repRange7" onclick="setReportesRango(7,this)">7 días</button>
        <button class="cat-chip" id="repRange30" onclick="setReportesRango(30,this)">30 días</button>
        <button class="cat-chip" id="repRange365" onclick="setReportesRango(365,this)">Todo</button>
      </div>
      <div id="reportesContent"><div class="items-empty">Cargando...</div></div>
    </div>

    <div class="stock-panel modal-panel" id="cajaPanel">
      <div class="stock-panel-header">
        <div class="section-title" style="margin-bottom:0">Caja</div>
        <button class="close-btn" onclick="closeAllPanels()" title="Cerrar">✕</button>
      </div>
      <div id="cajaContent"><div class="items-empty">Cargando...</div></div>
    </div>

    <div class="stock-panel modal-panel" id="stockPanel">
      <div class="stock-panel-header">
        <div class="section-title" style="margin-bottom:0">Stock por producto</div>
        <button class="close-btn" onclick="closeAllPanels()" title="Cerrar">✕</button>
      </div>
      <div id="stockList"><div class="items-empty">Cargando...</div></div>
    </div>

    <div class="salon-split">

      <!-- IZQUIERDA: plano del salón -->
      <div class="salon-left">
        <div class="salon-toolbar">
          <button class="btn-primary" onclick="startTakeaway()">+ Takeaway</button>
          <button class="btn-outline" onclick="toggleMesaForm()">+ Mesa</button>
        </div>
        <div class="salon-toolbar" id="editToolbar">
          <button class="btn-outline" id="btnEditarSalon" onclick="toggleEditSalon()">Editar plano</button>

<script>
const SESSION_KEY = "125cc_pos_auth";
const STAFF_KEY = "125cc_pos_staff";

let mesas = [];
let productos = [];
let currentComanda = null;   // {id, mesa_id, mesa_nombre, estado, total}
let currentItems = [];
let catFiltro = 'todas';
let tipoFiltro = 'todos'; // 'todos' | 'vino' | 'menu'
let pagosState = [];         // [{medio_pago, monto}] — pagos del cobro actual (uno o varios)
let editingSalon = false;
let pendingPositions = {};   // {mesaId: {pos_x, pos_y}} — se llena al arrastrar

// ── AUTH ──────────────────────────────────────────────────────────
function authHeader(){
  return { 'Authorization': 'Bearer ' + (sessionStorage.getItem(SESSION_KEY) || '') };
}

async function api(path, opts){
  opts = opts || {};
  const headers = Object.assign({}, authHeader(), opts.body ? {'Content-Type':'application/json'} : {}, opts.headers || {});
  const res = await fetch(path, { method: opts.method || 'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (res.status === 401){ logout(); throw new Error('No autorizado'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || ('Error ' + res.status));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

async function tryLogin(){
  const pass = document.getElementById('passInput').value;
  const staff = document.getElementById('staffInput').value.trim();
  document.getElementById('loginError').style.display = 'none';
  try {
    const res = await fetch('/api/pos?r=auth', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password: pass })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error();
    sessionStorage.setItem(SESSION_KEY, pass);
    sessionStorage.setItem(STAFF_KEY, staff || '');
    enterApp();
  } catch(e){
    document.getElementById('loginError').style.display = 'block';
  }
}

function logout(){
  sessionStorage.removeItem(SESSION_KEY);
  sessionStorage.removeItem(STAFF_KEY);
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

function enterApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('topStaff').textContent = sessionStorage.getItem(STAFF_KEY) || '';
  loadMesas();
}

// ── TOAST ─────────────────────────────────────────────────────────
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(() => { t.className = 'toast'; }, 2600);
}

// ── MESAS / PLANO DEL SALÓN ─────────────────────────────────────────
async function loadMesas(){
  try {
    const data = await api('/api/pos?r=mesas');
    mesas = data.mesas;
    renderSalonPlano();
  } catch(e){ toast(e.message, 'error'); }
}

// Posición por defecto para mesas que todavía no se ubicaron a mano
// (grilla simple dentro del plano), para que sean visibles/tocables
// desde el primer momento y no haga falta arrastrar todo antes de usar.
function posicionPorDefecto(idx){
  const cols = 4;
  const x = 14 + (idx % cols) * 24;
  const y = 20 + Math.floor(idx / cols) * 30;
  return { x: Math.min(x, 92), y: Math.min(y, 85) };
}

// "Mesa 12" → "12" · "Barra 3" → "Bar" — abreviación corta para el pin.
function mesaAbbrev(nombre){
  const cleaned = nombre.replace(/^mesa\s*/i, '').trim();
  return escapeHtml(cleaned || nombre).slice(0, 3);
}

function renderSalonPlano(){
  const stage = document.getElementById('salonStage');
  stage.classList.toggle('salon-editing', editingSalon);
  if (!mesas.length){
    stage.innerHTML = '<div class="salon-hint">Todavía no hay mesas. Usá "+ Mesa" para cargar la primera.</div>';
    return;
  }
  const selectedId = currentComanda ? currentComanda.mesa_id : null;
  stage.innerHTML = '';
  mesas.forEach((m, idx) => {
    const hasPos = m.pos_x != null && m.pos_y != null;
    const pos = hasPos ? { x: Number(m.pos_x), y: Number(m.pos_y) } : posicionPorDefecto(idx);
    const pin = document.createElement('div');
    pin.className = `salon-pin ${m.estado}${selectedId === m.id ? ' selected' : ''}`;
    pin.style.left = pos.x + '%';
    pin.style.top = pos.y + '%';
    pin.dataset.mesaId = m.id;
    pin.innerHTML = `
      <div class="salon-pin-dotwrap">
        <div class="salon-pin-dot">${mesaAbbrev(m.nombre)}</div>
        ${m.capacidad ? `<div class="salon-pin-badge">${m.capacidad}</div>` : ''}
      </div>
      <div class="salon-pin-label">${escapeHtml(m.nombre)}</div>`;
    pin.addEventListener('click', () => { if (!editingSalon) openMesa(m.id); });
    if (editingSalon) makeDraggable(pin, m.id);
    stage.appendChild(pin);
  });
}

function highlightPin(mesaId){
  document.querySelectorAll('.salon-pin').forEach(p => p.classList.toggle('selected', Number(p.dataset.mesaId) === mesaId));
}
function clearPinSelection(){
  document.querySelectorAll('.salon-pin').forEach(p => p.classList.remove('selected'));
}

function makeDraggable(pin, mesaId){
  let dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;
  const stage = document.getElementById('salonStage');

  pin.addEventListener('pointerdown', (e) => {
    dragging = true;
    pin.classList.add('dragging');
    pin.setPointerCapture(e.pointerId);
    startX = e.clientX; startY = e.clientY;
    origLeft = parseFloat(pin.style.left);
    origTop = parseFloat(pin.style.top);
  });
  pin.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const rect = stage.getBoundingClientRect();
    const dxPct = ((e.clientX - startX) / rect.width) * 100;
    const dyPct = ((e.clientY - startY) / rect.height) * 100;
    const newLeft = Math.max(3, Math.min(97, origLeft + dxPct));
    const newTop = Math.max(3, Math.min(97, origTop + dyPct));
    pin.style.left = newLeft + '%';
    pin.style.top = newTop + '%';
    pendingPositions[mesaId] = { pos_x: newLeft, pos_y: newTop };
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    pin.classList.remove('dragging');
  }
  pin.addEventListener('pointerup', endDrag);
  pin.addEventListener('pointercancel', endDrag);
}

function toggleEditSalon(){
  editingSalon = true;
  pendingPositions = {};
  document.getElementById('btnEditarSalon').style.display = 'none';
  document.getElementById('btnGuardarSalon').style.display = 'inline-block';
  document.getElementById('btnCancelarSalon').style.display = 'inline-block';
  renderSalonPlano();
  toast('Arrastrá las mesas a su lugar y guardá', 'success');
}

function cancelarEditSalon(){
  editingSalon = false;
  pendingPositions = {};
  document.getElementById('btnEditarSalon').style.display = 'inline-block';
  document.getElementById('btnGuardarSalon').style.display = 'none';
  document.getElementById('btnCancelarSalon').style.display = 'none';
  renderSalonPlano();
}

async function guardarSalonPlano(){
  // Se guardan TODAS las posiciones visibles (no solo las movidas), así
  // la primera vez que se guarda también queda persistida la grilla por
  // defecto de las mesas que no se llegaron a arrastrar. Una vez guardado
  // el plano queda fijo — no hace falta reacomodar cada vez que se usa.
  const pins = document.querySelectorAll('#salonStage .salon-pin');
  const cambios = Array.from(pins).map(pin => ({
    id: Number(pin.dataset.mesaId),
    pos_x: pendingPositions[pin.dataset.mesaId]?.pos_x ?? parseFloat(pin.style.left),
    pos_y: pendingPositions[pin.dataset.mesaId]?.pos_y ?? parseFloat(pin.style.top),
  }));
  try {
    await api('/api/pos?r=mesas-pos', { method: 'POST', body: { cambios } });
    toast('Plano guardado', 'success');
    cancelarEditSalon();
    loadMesas();
  } catch(e){ toast(e.message, 'error'); }
}

function toggleMesaForm(){
  document.getElementById('mesaForm').classList.toggle('open');
}

async function submitMesaForm(){
  const nombre = document.getElementById('mesaNombre').value.trim();
  const capacidad = document.getElementById('mesaCap').value;
  if (!nombre) return toast('Falta el nombre de la mesa', 'error');
  try {
    await api('/api/pos?r=mesas', { method: 'POST', body: { nombre, capacidad: capacidad || null } });
    document.getElementById('mesaNombre').value = '';
    document.getElementById('mesaCap').value = '';
    toggleMesaForm();
    toast('Mesa creada', 'success');
    loadMesas();
  } catch(e){ toast(e.message, 'error'); }
}

async function openMesa(mesaId){
  if (editingSalon) return;
  const mesa = mesas.find(m => m.id === mesaId);
  if (!mesa) return;
  highlightPin(mesaId);
  if (mesa.comanda_id){
    openComanda(mesa.comanda_id);
    return;
  }
  try {
    const staff = sessionStorage.getItem(STAFF_KEY);
    const data = await api('/api/pos?r=comandas', { method: 'POST', body: { mesa_id: mesaId, atendido_por: staff } });
    openComanda(data.comanda.id);
  } catch(e){ toast(e.message, 'error'); }
}

async function startTakeaway(){
  clearPinSelection();
  try {
    const staff = sessionStorage.getItem(STAFF_KEY);
    const data = await api('/api/pos?r=comandas', { method: 'POST', body: { atendido_por: staff } });
    openComanda(data.comanda.id);
  } catch(e){ toast(e.message, 'error'); }
}

// ── PANEL DE COMANDA ─────────────────────────────────────────────
async function openComanda(id){
  try {
    const data = await api('/api/pos?r=comanda&id=' + id);
    currentComanda = data.comanda;
    currentItems = data.items;
    document.getElementById('panelEmpty').style.display = 'none';
    document.getElementById('panelContent').style.display = 'block';
    document.getElementById('comandaHeader').classList.toggle('takeaway', !currentComanda.mesa_id);
    document.getElementById('comandaTitle').textContent = currentComanda.mesa_nombre || 'Takeaway';
    document.getElementById('comandaSub').textContent = currentComanda.atendido_por ? ('Atiende: ' + currentComanda.atendido_por) : '';
    document.getElementById('cobrarPanel').classList.remove('open');
    document.getElementById('productoForm').classList.remove('open');
    document.getElementById('trasladarForm').classList.remove('open');
    document.getElementById('descuentoForm').classList.remove('open');
    renderItems();
    if (!productos.length) await loadProductos();
    renderTipoChips();
    renderCatChips();
    renderProductos();
  } catch(e){ toast(e.message, 'error'); }
}

function cerrarPanel(){
  currentComanda = null;
  currentItems = [];
  document.getElementById('panelContent').style.display = 'none';
  document.getElementById('panelEmpty').style.display = 'block';
  clearPinSelection();
  loadMesas();
}

// Espejo del aplicarDescuento() de api/_lib/pos/comanda-cerrar.js — solo
// para mostrar el total correcto en pantalla antes de cobrar. El cálculo
// que realmente vale es el que hace el backend al cerrar.
function aplicarDescuentoClient(subtotal, tipo, valor){
  if (!tipo || valor == null) return subtotal;
  const v = Number(valor);
  if (!Number.isFinite(v) || v <= 0) return subtotal;
  const total = tipo === 'porcentaje' ? subtotal * (1 - v / 100) : subtotal - v;
  return Math.max(0, Math.round(total));
}

function totalConDescuento(){
  const activos = currentItems.filter(i => i.estado === 'activo');
  const subtotal = activos.reduce((s,i) => s + Number(i.precio_unitario) * i.cantidad, 0);
  return aplicarDescuentoClient(subtotal, currentComanda.descuento_tipo, currentComanda.descuento_valor);
}

// Solo se muestran los ítems activos (los anulados no quedan en la lista,
// no hay "historial de borrados" en esta vista).
function renderItems(){
  const box = document.getElementById('itemsBox');
  const activos = currentItems.filter(i => i.estado === 'activo');
  if (!activos.length){ box.innerHTML = '<div class="items-empty">Todavía no se agregó nada.</div>'; }
  else {
    box.innerHTML = activos.map(it => `
      <div class="item-row">
        <div class="qty-stepper">
          <button class="qty-btn" onclick="restarItem(${it.id})">−</button>
          <div class="qty-val">${it.cantidad}</div>
          <button class="qty-btn" onclick="agregarProducto(${it.producto_id})">+</button>
        </div>
        <div class="item-name">${escapeHtml(it.nombre_snapshot)}</div>
        <div class="item-price">${fmtMoney(it.precio_unitario * it.cantidad)}</div>
        <button class="item-remove" onclick="anularItem(${it.id})" title="Quitar">✕</button>
      </div>`).join('');
  }
  const subtotal = activos.reduce((s,i) => s + Number(i.precio_unitario) * i.cantidad, 0);
  const total = aplicarDescuentoClient(subtotal, currentComanda.descuento_tipo, currentComanda.descuento_valor);
  const totalBar = document.getElementById('totalBar');
  if (currentComanda.descuento_tipo){
    const etiqueta = currentComanda.descuento_tipo === 'porcentaje' ? `${currentComanda.descuento_valor}%` : fmtMoney(currentComanda.descuento_valor);
    totalBar.innerHTML = `
      <div>
        <div class="total-label">Total</div>
        <div style="font-size:var(--fs-xs);color:rgba(255,255,255,.55);margin-top:2px">Subtotal ${fmtMoney(subtotal)} · desc. −${etiqueta}</div>
      </div>
      <div class="total-val">${fmtMoney(total)}</div>`;
  } else {
    totalBar.innerHTML = `<div class="total-label">Total</div><div class="total-val">${fmtMoney(total)}</div>`;
  }
}

async function refreshComanda(){
  const data = await api('/api/pos?r=comanda&id=' + currentComanda.id);
  currentComanda = data.comanda;
  currentItems = data.items;
  renderItems();
}

// Agregar/sumar una unidad de un producto — el backend consolida en la
// misma línea si ya hay una activa para ese producto (stepper +), y
// descuenta stock si el producto lo trackea. Sin stock disponible el
// backend devuelve 409 — se ofrece cargar igual (forzar:true) por si se
// abrió una botella nueva que todavía no se registró.
async function agregarProducto(productoId, forzar){
  try {
    await api('/api/pos?r=comanda-item', { method: 'POST', body: { comanda_id: currentComanda.id, producto_id: productoId, forzar: !!forzar } });
    await refreshComanda();
    await refreshStockBadges();
  } catch(e){
    if (e.status === 409 && e.data && 'disponible' in e.data) {
      if (confirm('Sin stock cargado para este producto. ¿Agregar igual?')) return agregarProducto(productoId, true);
      return;
    }
    toast(e.message, 'error');
  }
}

// Restar una unidad (stepper −); si llega a 0 la línea se anula sola.
// Restaura 1 unidad de stock.
async function restarItem(itemId){
  try {
    await api('/api/pos?r=comanda-item', { method: 'POST', body: { comanda_id: currentComanda.id, accion: 'restar', item_id: itemId } });
    await refreshComanda();
    await refreshStockBadges();
  } catch(e){ toast(e.message, 'error'); }
}

// Quitar la línea entera de una, sin importar la cantidad (botón ✕).
// Restaura todo el stock de esa línea.
async function anularItem(itemId){
  try {
    await api('/api/pos?r=comanda-item', { method: 'POST', body: { comanda_id: currentComanda.id, accion: 'anular', item_id: itemId } });
    await refreshComanda();
    await refreshStockBadges();
  } catch(e){ toast(e.message, 'error'); }
}

async function refreshStockBadges(){
  await loadProductos();
  renderProductos();
}

function toggleCobrarPanel(){
  if (!currentItems.some(i => i.estado === 'activo')) return toast('No hay ítems activos para cobrar', 'error');
  const panel = document.getElementById('cobrarPanel');
  const abrir = !panel.classList.contains('open');
  panel.classList.toggle('open');
  if (abrir){
    pagosState = [{ medio_pago: 'efectivo', monto: totalConDescuento() }];
    renderPagosRows();
  }
}

function renderPagosRows(){
  const total = totalConDescuento();
  const suma = pagosState.reduce((s,p) => s + (Number(p.monto) || 0), 0);
  const ok = Math.abs(suma - total) <= 1;
  document.getElementById('cobrarResumen').innerHTML = `
    <div class="stock-row"><div class="stock-row-name">Total a cobrar</div><div style="font-weight:700">${fmtMoney(total)}</div></div>
    <div class="stock-row"><div class="stock-row-name">Suma de pagos</div><div style="font-weight:700;color:${ok ? 'var(--green)' : 'var(--red)'}">${fmtMoney(suma)}</div></div>`;

  const rows = document.getElementById('pagosRows');
  rows.innerHTML = pagosState.map((p, i) => `
    <div class="form-row" style="margin-bottom:8px;grid-template-columns:1fr 1fr auto">
      <select class="stock-input" style="width:100%" onchange="pagosState[${i}].medio_pago=this.value">
        <option value="efectivo" ${p.medio_pago==='efectivo'?'selected':''}>Efectivo</option>
        <option value="tarjeta" ${p.medio_pago==='tarjeta'?'selected':''}>Tarjeta</option>
        <option value="transferencia" ${p.medio_pago==='transferencia'?'selected':''}>Transferencia</option>
      </select>
      <input type="number" class="stock-input" style="width:100%" value="${p.monto}" min="0" step="50"
        oninput="pagosState[${i}].monto=Number(this.value)||0; renderPagosRows()">
      ${pagosState.length > 1 ? `<button class="item-remove" onclick="quitarPagoRow(${i})">✕</button>` : '<span></span>'}
    </div>`).join('');
}

function agregarPagoRow(){
  pagosState.push({ medio_pago: 'efectivo', monto: 0 });
  renderPagosRows();
}
function quitarPagoRow(i){
  pagosState.splice(i, 1);
  renderPagosRows();
}

// Reparte el total en N partes iguales (redondeadas a $50, el resto va a
// la última) — cada parte sigue siendo editable a mano después.
function dividirPagos(){
  const n = Math.max(1, Math.min(6, Number(document.getElementById('dividirN').value) || 1));
  const total = totalConDescuento();
  const base = Math.floor(total / n / 50) * 50;
  const rows = [];
  let acumulado = 0;
  for (let i = 0; i < n; i++){
    const monto = i === n - 1 ? total - acumulado : base;
    acumulado += monto;
    rows.push({ medio_pago: 'efectivo', monto });
  }
  pagosState = rows;
  renderPagosRows();
}

async function confirmCobrar(){
  const total = totalConDescuento();
  const suma = pagosState.reduce((s,p) => s + (Number(p.monto) || 0), 0);
  if (Math.abs(suma - total) > 1) return toast('La suma de los pagos no coincide con el total', 'error');
  try {
    await api('/api/pos?r=comanda-cerrar', { method: 'POST', body: { comanda_id: currentComanda.id, pagos: pagosState } });
    toast('Comanda cobrada', 'success');
    cerrarPanel();
  } catch(e){ toast(e.message, 'error'); }
}

// ── PRODUCTOS ─────────────────────────────────────────────────────
async function loadProductos(){
  try {
    const data = await api('/api/pos?r=productos');
    productos = data.productos;
  } catch(e){ toast(e.message, 'error'); }
}

// Un producto es "Vino" si viene del import del menú (vino_ref) o su
// categoría es alguno de los tipos de vino; el resto cae en "Menú"
// (tapeo, bebidas sin alcohol, lo que se cargue a mano fuera del vino).
const CATEGORIAS_VINO = ['tinto', 'blanco', 'rosado', 'naranjo', 'vino'];
function esVino(p){
  return p.vino_ref != null || CATEGORIAS_VINO.includes((p.categoria || '').toLowerCase());
}
function productosPorTipo(){
  if (tipoFiltro === 'vino') return productos.filter(esVino);
  if (tipoFiltro === 'menu') return productos.filter(p => !esVino(p));
  return productos;
}

function renderTipoChips(){
  const opciones = [['todos', 'Todos'], ['vino', 'Vino'], ['menu', 'Menú']];
  document.getElementById('tipoChips').innerHTML = opciones.map(([v, l]) => `
    <div class="cat-chip ${v === tipoFiltro ? 'active' : ''}" onclick="setTipoFiltro('${v}')">${l}</div>`).join('');
}

function setTipoFiltro(v){
  tipoFiltro = v;
  catFiltro = 'todas'; // al cambiar de tipo, reiniciar la subcategoría
  renderTipoChips();
  renderCatChips();
  renderProductos();
}

function renderCatChips(){
  const base = productosPorTipo();
  const cats = ['todas', ...new Set(base.map(p => p.categoria))];
  document.getElementById('catChips').innerHTML = cats.map(c => `
    <div class="cat-chip ${c === catFiltro ? 'active' : ''}" onclick="setCatFiltro('${escapeHtml(c)}')">${escapeHtml(c)}</div>`).join('');
}

function setCatFiltro(c){
  catFiltro = c;
  renderCatChips();
  renderProductos();
}

function renderProductos(){
  const grid = document.getElementById('prodGrid');
  const q = (document.getElementById('prodSearch').value || '').trim().toLowerCase();
  let list = productosPorTipo();
  if (catFiltro !== 'todas') list = list.filter(p => p.categoria === catFiltro);
  if (q) list = list.filter(p => p.nombre.toLowerCase().includes(q));
  if (!list.length){ grid.innerHTML = '<div class="items-empty">Sin productos. Usá "+ Producto" o importá los vinos del menú.</div>'; return; }
  grid.innerHTML = list.map(p => {
    const sinStock = p.stock_actual != null && p.stock_actual <= 0;
    const stockBajo = p.stock_actual != null && p.stock_minimo != null && p.stock_actual > 0 && p.stock_actual <= p.stock_minimo;
    return `
    <div class="prod-card ${sinStock ? 'sin-stock' : ''}" onclick="agregarProducto(${p.id})">
      <div class="prod-name">${escapeHtml(p.nombre)}</div>
      <div class="prod-unidad">${p.unidad_venta}</div>
      <div class="prod-price">${fmtMoney(p.precio)}</div>
      ${sinStock ? '<div class="prod-stock-low">Sin stock</div>' : (stockBajo ? '<div class="prod-stock-low">Stock bajo: ' + p.stock_actual + '</div>' : '')}
    </div>`;
  }).join('');
}

async function importarVinos(){
  const btn = document.getElementById('btnImportarVinos');
  btn.disabled = true;
  btn.textContent = 'Importando...';
  try {
    const data = await api('/api/pos?r=productos-import', { method: 'POST' });
    toast(`Importados: ${data.creados} nuevos, ${data.actualizados} actualizados`, 'success');
    await loadProductos();
    renderTipoChips();
    renderCatChips();
    renderProductos();
  } catch(e){ toast(e.message, 'error'); }
  finally {
    btn.disabled = false;
    btn.textContent = '↻ Importar vinos del menú';
  }
}

// ── MODALES (Reportes/Caja/Stock) ────────────────────────────────
// Los tres viven en modales superpuestos: uno solo abierto a la vez, con
// fondo oscurecido y cierre explícito (✕ o tocar afuera) — antes cada uno
// empujaba el resto de la página hacia abajo y podían quedar varios
// abiertos juntos, sin forma clara de saber cuál estaba activo.
let panelAbierto = null; // 'reportes' | 'caja' | 'stock' | null
const PANEL_NAV_ID = { reportes: 'navReportes', caja: 'navCaja', stock: 'navStock' };

function closeAllPanels(){
  for (const name of Object.keys(PANEL_NAV_ID)){
    document.getElementById(name + 'Panel').classList.remove('open');
    document.getElementById(PANEL_NAV_ID[name]).classList.remove('nav-active');
  }
  document.getElementById('modalBackdrop').classList.remove('open');
  panelAbierto = null;
}

async function togglePanel(name){
  const yaEstabaAbierto = panelAbierto === name;
  closeAllPanels();
  if (yaEstabaAbierto) return;

  document.getElementById(name + 'Panel').classList.add('open');
  document.getElementById(PANEL_NAV_ID[name]).classList.add('nav-active');
  document.getElementById('modalBackdrop').classList.add('open');
  panelAbierto = name;

  if (name === 'reportes') await loadReportes();
  else if (name === 'caja') await loadCaja();
  else if (name === 'stock'){
    if (!productos.length) await loadProductos();
    renderStockList();
  }
}

// ── REPORTES ──────────────────────────────────────────────────────
let reportesDias = 7;

function setReportesRango(dias, btn){
  reportesDias = dias;
  document.querySelectorAll('#repRange7,#repRange30,#repRange365').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadReportes();
}

const MEDIO_LABEL = { efectivo: 'Efectivo', tarjeta: 'Tarjeta', transferencia: 'Transferencia', mixto: 'Mixto' };

async function loadReportes(){
  const box = document.getElementById('reportesContent');
  box.innerHTML = '<div class="items-empty">Cargando...</div>';
  try {
    const data = await api('/api/pos?r=reportes&dias=' + reportesDias);
    renderReportes(data);
  } catch(e){ toast(e.message, 'error'); }
}

function renderReportes(data){
  const box = document.getElementById('reportesContent');
  const porMedio = data.totalesPorMedio.map(m => `
    <div class="stock-row"><div class="stock-row-name">${MEDIO_LABEL[m.medio_pago] || m.medio_pago || '—'}</div><div>${fmtMoney(m.total)} <span class="stock-row-name-sub">(${m.cantidad})</span></div></div>
  `).join('') || '<div class="items-empty">Sin ventas en el período.</div>';

  const top = data.topProductos.map((p, i) => `
    <div class="stock-row"><div class="stock-row-name">${i+1}. ${escapeHtml(p.nombre_snapshot)}</div><div>${p.unidades} · ${fmtMoney(p.total)}</div></div>
  `).join('') || '<div class="items-empty">Sin ventas en el período.</div>';

  const cajas = data.cajas.map(c => {
    const dif = Number(c.diferencia);
    const color = dif === 0 ? 'var(--green)' : (dif < 0 ? 'var(--red)' : 'var(--blue)');
    const fecha = new Date(c.cerrada_at).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    return `<div class="stock-row">
      <div class="stock-row-name">${fecha} · ${escapeHtml(c.cerrada_por || '—')}</div>
      <div style="color:${color};font-weight:700">${fmtMoney(dif)}</div>
    </div>`;
  }).join('') || '<div class="items-empty">Sin cierres en el período.</div>';

  const anulados = data.anulados.map(a => `
    <div class="stock-row"><div class="stock-row-name">${a.cantidad} × ${escapeHtml(a.nombre_snapshot)} <span class="stock-row-name-sub">comanda #${a.comanda_id}</span></div><div>${fmtMoney(a.precio_unitario * a.cantidad)}</div></div>
  `).join('') || '<div class="items-empty">Sin anulaciones.</div>';

  box.innerHTML = `
    <div class="total-bar" style="border-radius:var(--r-md);margin-bottom:16px">
      <div class="total-label">Total período</div>
      <div class="total-val">${fmtMoney(data.totalGeneral.total)} <span style="font-size:var(--fs-sm);font-weight:400">(${data.totalGeneral.cantidad})</span></div>
    </div>
    <div class="section-title">Por medio de pago</div>
    ${porMedio}
    <div class="section-title" style="margin-top:16px">Productos más vendidos</div>
    ${top}
    <div class="section-title" style="margin-top:16px">Cierres de caja (diferencia)</div>
    ${cajas}
    <div class="section-title" style="margin-top:16px">Anulaciones recientes</div>
    ${anulados}
  `;
}

// ── CAJA ──────────────────────────────────────────────────────────

async function loadCaja(){
  try {
    const data = await api('/api/pos?r=caja');
    renderCaja(data);
  } catch(e){ toast(e.message, 'error'); }
}

function renderCaja(data){
  const box = document.getElementById('cajaContent');
  if (!data.sesion){
    box.innerHTML = `
      <div class="form-row">
        <input type="number" id="cajaMontoInicial" class="stock-input" style="width:100%" placeholder="Monto inicial" min="0" step="100">
      </div>
      <button class="btn-primary" style="width:100%" onclick="abrirCajaAction()">Abrir caja</button>`;
    return;
  }
  const t = data.totales || {};
  const fmt = k => fmtMoney(t[k] || 0);
  box.innerHTML = `
    <div class="stock-row"><div class="stock-row-name">Monto inicial</div><div>${fmtMoney(data.sesion.monto_inicial)}</div></div>
    <div class="stock-row"><div class="stock-row-name">Abierta por</div><div>${escapeHtml(data.sesion.abierta_por || '—')}</div></div>

    <div class="section-title" style="margin-top:16px">Ventas por medio de pago</div>
    <div class="stock-row"><div class="stock-row-name">Efectivo</div><div>${fmt('venta_efectivo')}</div></div>
    <div class="stock-row"><div class="stock-row-name">Tarjeta</div><div>${fmt('venta_tarjeta')}</div></div>
    <div class="stock-row"><div class="stock-row-name">Transferencia</div><div>${fmt('venta_transferencia')}</div></div>
    <div class="stock-row"><div class="stock-row-name">Mixto/otro</div><div>${fmt('venta_otro')}</div></div>

    <div class="section-title" style="margin-top:16px">Movimientos manuales (efectivo)</div>
    <div class="stock-row"><div class="stock-row-name">Retiros</div><div>− ${fmt('retiro_efectivo')}</div></div>
    <div class="stock-row"><div class="stock-row-name">Ingresos</div><div>${fmt('ingreso_efectivo')}</div></div>
    <div class="stock-row"><div class="stock-row-name">Propinas</div><div>${fmt('propina_efectivo')}</div></div>

    <div class="section-title" style="margin-top:16px">Nuevo movimiento</div>
    <div class="form-row">
      <select id="movTipo" class="stock-input" style="width:100%">
        <option value="retiro">Retiro</option><option value="ingreso">Ingreso</option><option value="propina">Propina</option>
      </select>
      <select id="movMedio" class="stock-input" style="width:100%">
        <option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option><option value="transferencia">Transferencia</option><option value="otro">Otro</option>
      </select>
    </div>
    <div class="form-row">
      <input type="number" id="movMonto" class="stock-input" style="width:100%" placeholder="Monto" min="0" step="100">
      <input type="text" id="movDesc" class="stock-input" style="width:100%" placeholder="Descripción (opcional)" maxlength="200">
    </div>
    <button class="btn-outline" style="width:100%;margin-bottom:16px" onclick="registrarMovimientoCaja()">Registrar movimiento</button>

    <div class="section-title">Cerrar caja</div>
    <div class="form-row">
      <input type="number" id="cajaMontoContado" class="stock-input" style="width:100%" placeholder="Efectivo contado" min="0" step="100">
    </div>
    <button class="btn-black" style="width:100%" onclick="cerrarCajaAction()">Cerrar caja</button>`;
}

async function abrirCajaAction(){
  const monto = document.getElementById('cajaMontoInicial').value;
  try {
    const staff = sessionStorage.getItem(STAFF_KEY);
    await api('/api/pos?r=caja', { method: 'POST', body: { monto_inicial: monto || 0, abierta_por: staff } });
    toast('Caja abierta', 'success');
    await loadCaja();
  } catch(e){ toast(e.message, 'error'); }
}

async function registrarMovimientoCaja(){
  const tipo = document.getElementById('movTipo').value;
  const medio_pago = document.getElementById('movMedio').value;
  const monto = document.getElementById('movMonto').value;
  const descripcion = document.getElementById('movDesc').value;
  if (!monto) return toast('Falta el monto', 'error');
  try {
    await api('/api/pos?r=caja-movimiento', { method: 'POST', body: { tipo, medio_pago, monto, descripcion } });
    toast('Movimiento registrado', 'success');
    await loadCaja();
  } catch(e){ toast(e.message, 'error'); }
}

async function cerrarCajaAction(){
  const contado = document.getElementById('cajaMontoContado').value;
  if (!contado) return toast('Falta el monto contado', 'error');
  if (!confirm('¿Cerrar la caja? No se puede deshacer.')) return;
  try {
    const staff = sessionStorage.getItem(STAFF_KEY);
    const data = await api('/api/pos?r=caja-cerrar', { method: 'POST', body: { monto_final_contado: contado, cerrada_por: staff } });
    const s = data.sesion;
    const dif = Number(s.diferencia);
    toast(`Caja cerrada. Diferencia: ${fmtMoney(dif)}`, dif === 0 ? 'success' : 'error');
    await loadCaja();
  } catch(e){ toast(e.message, 'error'); }
}

// ── STOCK ─────────────────────────────────────────────────────────

function renderStockList(){
  const box = document.getElementById('stockList');
  if (!productos.length){ box.innerHTML = '<div class="items-empty">Todavía no hay productos cargados.</div>'; return; }
  box.innerHTML = productos.map(p => `
    <div class="stock-row">
      <div>
        <div class="stock-row-name">${escapeHtml(p.nombre)}</div>
        <div class="stock-row-name-sub">${escapeHtml(p.categoria)} · ${p.unidad_venta}</div>
      </div>
      <input type="number" class="stock-input" id="stockAct_${p.id}" value="${p.stock_actual ?? ''}" placeholder="Actual" min="0">
      <input type="number" class="stock-input" id="stockMin_${p.id}" value="${p.stock_minimo ?? ''}" placeholder="Mín" min="0">
      <button class="btn-outline" onclick="guardarStock(${p.id})">Guardar</button>
    </div>`).join('');
}

async function guardarStock(productoId){
  const p = productos.find(x => x.id === productoId);
  if (!p) return;
  const stockActVal = document.getElementById('stockAct_' + productoId).value;
  const stockMinVal = document.getElementById('stockMin_' + productoId).value;
  try {
    await api('/api/pos?r=productos', { method: 'POST', body: {
      id: productoId, nombre: p.nombre, categoria: p.categoria, unidad_venta: p.unidad_venta, precio: p.precio,
      stock_actual: stockActVal === '' ? null : stockActVal,
      stock_minimo: stockMinVal === '' ? null : stockMinVal,
      activo: p.activo,
    }});
    toast('Stock actualizado', 'success');
    await loadProductos();
    renderStockList();
    renderProductos();
  } catch(e){ toast(e.message, 'error'); }
}

function toggleProductoForm(){
  document.getElementById('productoForm').classList.toggle('open');
}

async function submitProductoForm(){
  const nombre = document.getElementById('prodNombre').value.trim();
  const categoria = document.getElementById('prodCategoria').value.trim();
  const precio = document.getElementById('prodPrecio').value;
  const unidad_venta = document.getElementById('prodUnidad').value;
  if (!nombre || !precio) return toast('Falta nombre o precio', 'error');
  try {
    await api('/api/pos?r=productos', { method: 'POST', body: { nombre, categoria, precio, unidad_venta } });
    document.getElementById('prodNombre').value = '';
    document.getElementById('prodCategoria').value = '';
    document.getElementById('prodPrecio').value = '';
    toggleProductoForm();
    toast('Producto creado', 'success');
    await loadProductos();
    renderTipoChips();
    renderCatChips();
    renderProductos();
  } catch(e){ toast(e.message, 'error'); }
}

// ── HELPERS ───────────────────────────────────────────────────────
function fmtMoney(n){
  return '$' + Number(n).toLocaleString('es-AR', { maximumFractionDigits: 0 });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── INIT ──────────────────────────────────────────────────────────
if (sessionStorage.getItem(SESSION_KEY)) enterApp();
</script>
